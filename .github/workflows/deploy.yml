name: Deploy Landing

on:
  push:
    branches: [dev, main, feat/astro-migration]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set env and deploy path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
            echo "SSH_HOST=${{ secrets.SSH_HOST }}" >> $GITHUB_ENV
            echo "PUBLIC_ENV=production" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_YANDEX_VERIFICATION=${{ secrets.YANDEX_VERIFICATION }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_ENV
            echo "SSH_HOST=aivisiontest.ru" >> $GITHUB_ENV
            echo "PUBLIC_ENV=development" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://aivisiontest.ru" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.aivisiontest.ru" >> $GITHUB_ENV
            # PUBLIC keyed-ingest token by design: ships in the client bundle,
            # rate-limited server-side, so a plain env var in the dev build is fine.
            echo "PUBLIC_INGEST_KEY=av_dev_100b8251f21fc6f0a9ff2012addb34429f213b72" >> $GITHUB_ENV
          fi

      - name: Build (Astro)
        run: npm run build

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ \
            ${{ secrets.SSH_USER }}@"$SSH_HOST":$DEPLOY_PATH/dist/
