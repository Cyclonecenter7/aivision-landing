server {
    server_name shvec.tech www.shvec.tech;

    root /opt/shvec-site/dist;
    index index.html;

    include /etc/nginx/snippets/shvec-security-prod.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /case/1 { return 301 /cases/education/; }
    location = /case/1/ { return 301 /cases/education/; }
    location = /case/2 { return 301 /cases/construction/; }
    location = /case/2/ { return 301 /cases/construction/; }
    location = /case/3 { return 301 /cases/ecommerce/; }
    location = /case/3/ { return 301 /cases/ecommerce/; }

    location = /index.html {
        include /etc/nginx/snippets/shvec-security-prod.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=86400, stale-while-revalidate=604800" always;
    }
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        include /etc/nginx/snippets/shvec-security-prod.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /demo/ {
        include /etc/nginx/snippets/shvec-security-prod.conf;
        try_files $uri $uri/ /demo/index.html;
    }
    location / {
        include /etc/nginx/snippets/shvec-security-prod.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=86400, stale-while-revalidate=604800" always;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shvec.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shvec.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
