<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Skeleton Loaders" subtitle="Shimmer · KPI · Таблица · Дашборд · анимация загрузки" viewport="700x520" -->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:20px;-webkit-font-smoothing:antialiased;}

/* ── Shimmer ────────────────────────────────────────────────── */
@keyframes shimmer{
  0%  {background-position:200% 0}
  100%{background-position:-200% 0}
}
.sk{
  background:linear-gradient(90deg, #1E1E1E 25%, #2A2A2A 50%, #1E1E1E 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s ease-in-out infinite;
}
.ch8{clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);}
.ch6{clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
.ch4{clip-path:polygon(0 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%);}
.ch10{clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.label{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#444;margin-bottom:8px;}
</style>
</head>
<body>

<!-- KPI row skeletons -->
<div class="label">KPI Cards</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;">
  <div class="sk ch10" style="height:110px;padding:14px;">
    <div class="sk ch4" style="width:48px;height:8px;margin-bottom:10px;background:transparent;animation:none;opacity:.4;background:#2A2A2A;"></div>
    <div class="sk ch4" style="width:80%;height:20px;margin-bottom:8px;background:#252525;"></div>
    <div class="sk ch4" style="width:50%;height:10px;background:#252525;"></div>
  </div>
  <div class="sk ch10" style="height:110px;padding:14px;">
    <div style="width:48px;height:8px;margin-bottom:10px;background:#222;clip-path:polygon(0 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%);"></div>
    <div style="width:80%;height:20px;margin-bottom:8px;background:#222;clip-path:polygon(0 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%);"></div>
    <div style="width:50%;height:10px;background:#222;clip-path:polygon(0 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%);"></div>
  </div>
  <div class="sk ch10" style="height:110px;"></div>
  <div class="sk ch10" style="height:110px;"></div>
</div>

<!-- Table skeleton -->
<div class="label">Таблица заявок</div>
<div style="background:#181818;overflow:hidden;margin-bottom:14px;" class="ch10">
  <!-- thead -->
  <div style="background:#222;padding:10px 14px;display:flex;gap:16px;border-bottom:1px solid #2A2A2A;">
    <div class="sk" style="width:12px;height:10px;flex-shrink:0;opacity:.4;background:#2A2A2A;"></div>
    <div class="sk" style="width:100px;height:10px;background:#2A2A2A;"></div>
    <div class="sk" style="width:60px;height:10px;background:#2A2A2A;margin-left:auto;"></div>
    <div class="sk" style="width:50px;height:10px;background:#2A2A2A;"></div>
    <div class="sk" style="width:70px;height:10px;background:#2A2A2A;"></div>
  </div>
  <!-- rows -->
  <div style="padding:11px 14px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #222;">
    <div class="sk" style="width:12px;height:12px;border-radius:50%;flex-shrink:0;background:#222;"></div>
    <div class="sk ch4" style="width:120px;height:12px;background:#222;"></div>
    <div class="sk ch4" style="width:64px;height:18px;background:#222;margin-left:auto;"></div>
    <div class="sk ch4" style="width:50px;height:18px;background:#222;"></div>
    <div class="sk" style="width:72px;height:12px;background:#222;"></div>
  </div>
  <div style="padding:11px 14px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #222;">
    <div class="sk" style="width:12px;height:12px;border-radius:50%;flex-shrink:0;background:#222;"></div>
    <div class="sk ch4" style="width:90px;height:12px;background:#222;"></div>
    <div class="sk ch4" style="width:64px;height:18px;background:#222;margin-left:auto;"></div>
    <div class="sk ch4" style="width:50px;height:18px;background:#222;"></div>
    <div class="sk" style="width:60px;height:12px;background:#222;"></div>
  </div>
  <div style="padding:11px 14px;display:flex;gap:16px;align-items:center;">
    <div class="sk" style="width:12px;height:12px;border-radius:50%;flex-shrink:0;background:#222;"></div>
    <div class="sk ch4" style="width:110px;height:12px;background:#222;"></div>
    <div class="sk ch4" style="width:64px;height:18px;background:#222;margin-left:auto;"></div>
    <div class="sk ch4" style="width:50px;height:18px;background:#222;"></div>
    <div class="sk" style="width:80px;height:12px;background:#222;"></div>
  </div>
</div>

<!-- Dashboard layout skeleton -->
<div class="label">Дашборд — полный скелетон</div>
<div style="display:grid;grid-template-columns:160px 1fr;gap:0;background:#181818;height:200px;overflow:hidden;" class="ch10">
  <!-- sidebar -->
  <div style="border-right:1px solid #222;padding:12px 10px;display:flex;flex-direction:column;gap:6px;">
    <div class="sk" style="width:90px;height:14px;background:#222;margin-bottom:8px;"></div>
    <div class="sk ch6" style="height:28px;background:#252525;"></div>
    <div class="sk ch6" style="height:28px;background:#1E1E1E;"></div>
    <div class="sk ch6" style="height:28px;background:#1E1E1E;"></div>
    <div class="sk ch6" style="height:28px;background:#1E1E1E;"></div>
  </div>
  <!-- content -->
  <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="sk" style="width:24px;height:8px;background:#222;"></div>
      <div class="sk" style="width:140px;height:8px;background:#222;"></div>
    </div>
    <div class="sk" style="width:60%;height:22px;background:#252525;"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;">
      <div class="sk ch8" style="background:#222;"></div>
      <div class="sk ch8" style="background:#222;"></div>
      <div class="sk ch8" style="background:#222;"></div>
    </div>
  </div>
</div>

</body>
</html>
