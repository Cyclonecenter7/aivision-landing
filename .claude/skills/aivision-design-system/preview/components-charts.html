<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Charts" subtitle="Monotone line · Donut · Bar chart · фиксированный viewBox · нет DOM-зависимостей" viewport="700x340" -->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#fff;padding:20px;-webkit-font-smoothing:antialiased;font-family:'IBM Plex Sans',system-ui,sans-serif;}
.grid{display:grid;grid-template-columns:1fr 180px 180px;gap:12px;}
.card{background:#181818;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);padding:16px;}
.card-label{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#666;margin-bottom:12px;}
.legend{display:flex;gap:16px;margin-top:10px;}

.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>
<div class="grid">
  <!-- Line chart — static SVG, pre-computed smooth paths -->
  <div class="card">
    <div class="card-label">Маржа · Доходы · Расходы — Monotone curves</div>
    <svg id="lc" width="100%" viewBox="0 0 420 160" style="display:block;overflow:visible;"></svg>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#3F6EE8;"></span>Маржа</div>
      <div class="legend-item"><span class="legend-dot" style="background:#10B981;"></span>Доходы</div>
      <div class="legend-item"><span class="legend-dot" style="background:#F43F5E;"></span>Расходы</div>
    </div>
  </div>
  <!-- Donut — pure static SVG -->
  <div class="card">
    <div class="card-label">Статусы заявок</div>
    <svg id="donut" width="148" height="148" viewBox="0 0 148 148" style="display:block;margin:0 auto;"></svg>
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;">
      <div class="legend-item"><span class="legend-dot" style="background:#3F6EE8;"></span>Новые · 52</div>
      <div class="legend-item"><span class="legend-dot" style="background:#FCD34D;"></span>Связались · 23</div>
      <div class="legend-item"><span class="legend-dot" style="background:#94A3B8;"></span>Холодные · 10</div>
      <div class="legend-item"><span class="legend-dot" style="background:#10B981;"></span>Завершены · 6</div>
    </div>
  </div>
  <!-- Bar chart — flexbox, no JS needed -->
  <div class="card">
    <div class="card-label">Заявки по неделям</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:4px;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:55%;background:#3F6EE8;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#666;">Пн</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:80%;background:#3F6EE8;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#666;">Вт</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:65%;background:#3F6EE8;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#666;">Ср</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:100%;background:#3F6EE8;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#666;">Чт</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:75%;background:#3F6EE8;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#666;">Пт</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;">
        <div style="flex:1;display:flex;align-items:flex-end;width:100%;">
          <div style="width:100%;height:20%;background:#2A2A2A;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);"></div>
        </div>
        <div style="font-size:9px;color:#3A3A3A;">Сб</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Steffen monotone smooth ──────────────────────────────────── */
function smooth(pts) {
  const n = pts.length;
  if (n < 2) return '';
  if (n === 2) return `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
  const t = new Array(n);
  for (let i = 1; i < n - 1; i++) {
    const dx1 = pts[i][0]   - pts[i-1][0], dx2 = pts[i+1][0] - pts[i][0];
    const s1  = (pts[i][1]  - pts[i-1][1]) / dx1;
    const s2  = (pts[i+1][1]- pts[i][1])   / dx2;
    if (s1 * s2 <= 0) { t[i] = 0; }
    else {
      const p = (s1 * dx2 + s2 * dx1) / (dx1 + dx2);
      t[i] = Math.sign(s1) * Math.min(Math.abs(s1), Math.abs(s2), 0.5 * Math.abs(p));
    }
  }
  t[0]   = (pts[1][1]   - pts[0][1])   / (pts[1][0]   - pts[0][0]);
  t[n-1] = (pts[n-1][1] - pts[n-2][1]) / (pts[n-1][0] - pts[n-2][0]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (pts[i+1][0] - pts[i][0]) / 3;
    const cp1x = pts[i][0]   + dx, cp1y = pts[i][1]   + t[i]   * dx;
    const cp2x = pts[i+1][0] - dx, cp2y = pts[i+1][1] - t[i+1] * dx;
    d += ` C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${pts[i+1][0].toFixed(2)},${pts[i+1][1].toFixed(2)}`;
  }
  return d;
}

/* ── Line chart — fixed 420×160 viewBox ───────────────────────── */
(function buildLineChart() {
  const VW = 420, VH = 160;
  const pL = 36, pR = 8, pT = 12, pB = 24;
  const iW = VW - pL - pR, iH = VH - pT - pB;
  const labels = ['Окт','Ноя','Дек','Янв','Фев','Мар','Апр','Май'];
  const series = [
    { name:'Маржа',  color:'#3F6EE8', data:[820,950,1100,980,1250,1540,1480,1620] },
    { name:'Доходы', color:'#10B981', data:[1200,1380,1550,1490,1700,1950,1820,2100] },
    { name:'Расходы',color:'#F43F5E', data:[380,420,450,510,450,410,340,420] },
  ];
  const nice = 2200;
  const xStep = iW / (labels.length - 1);
  const xy = (i, v) => [
    pL + i * xStep,
    pT + iH - (v / nice) * iH
  ];

  let html = '';

  /* grid lines */
  [0, nice / 2, nice].forEach((tv, i) => {
    const y = pT + iH - (tv / nice) * iH;
    html += `<line x1="${pL}" x2="${VW-pR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#222" stroke-width="1" ${i ? 'stroke-dasharray="2 4"' : ''}/>`;
    html += `<text x="${pL-4}" y="${(y+3.5).toFixed(1)}" font-size="8" text-anchor="end" fill="#666" font-family="IBM Plex Sans">${tv >= 1000 ? (tv/1000).toFixed(0)+'K' : tv}</text>`;
  });

  /* x labels */
  labels.forEach((l, i) => {
    html += `<text x="${(pL + i * xStep).toFixed(1)}" y="${VH-6}" font-size="8" text-anchor="middle" fill="#666" font-family="IBM Plex Sans">${l}</text>`;
  });

  /* series */
  series.forEach((s, si) => {
    const pts = s.data.map((v, i) => xy(i, v));
    const line = smooth(pts);
    const last = pts[pts.length - 1];
    const area = line + ` L${last[0].toFixed(2)},${(pT+iH).toFixed(2)} L${pts[0][0].toFixed(2)},${(pT+iH).toFixed(2)} Z`;
    const gid = `g${si}`;
    html += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
    </linearGradient></defs>`;
    html += `<path d="${area}" fill="url(#${gid})"/>`;
    html += `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    /* dots — smaller, r=2.5 */
    pts.forEach(p => {
      html += `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="2.5" fill="#181818" stroke="${s.color}" stroke-width="1.75"/>`;
    });
  });

  document.getElementById('lc').innerHTML = html;
})();

/* ── Donut chart — fixed 148×148 viewBox ─────────────────────── */
(function buildDonut() {
  const cx = 74, cy = 74, R = 56, r = 38;
  const slices = [
    { v:52, c:'#3F6EE8' },
    { v:23, c:'#FCD34D' },
    { v:10, c:'#94A3B8' },
    { v:6,  c:'#10B981' },
  ];
  const total = slices.reduce((s, d) => s + d.v, 0);
  let angle = -Math.PI / 2, html = '';
  slices.forEach(d => {
    const slice = (d.v / total) * Math.PI * 2;
    const x1  = cx + R * Math.cos(angle),        y1  = cy + R * Math.sin(angle);
    const x2  = cx + R * Math.cos(angle + slice), y2  = cy + R * Math.sin(angle + slice);
    const xi1 = cx + r * Math.cos(angle + slice), yi1 = cy + r * Math.sin(angle + slice);
    const xi2 = cx + r * Math.cos(angle),         yi2 = cy + r * Math.sin(angle);
    const large = slice > Math.PI ? 1 : 0;
    html += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi1.toFixed(2)},${yi1.toFixed(2)} A${r},${r} 0 ${large} 0 ${xi2.toFixed(2)},${yi2.toFixed(2)} Z" fill="${d.c}" stroke="#181818" stroke-width="1.5"/>`;
    angle += slice;
  });
  html += `<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="IBM Plex Sans" font-variant-numeric="tabular-nums">${total}</text>`;
  html += `<text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="8" fill="#666" font-family="IBM Plex Sans" letter-spacing="0.1em">ВСЕГО</text>`;
  document.getElementById('donut').innerHTML = html;
})();
</script>
</body>
</html>
