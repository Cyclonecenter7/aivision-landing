<!-- @startingPoint section="Экраны" subtitle="Лендинг: hero, кейсы, тарифы, CTA" viewport="1280x800" -->
<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Landing" name="UI Kit — Landing Page" subtitle="Лендинг aivisionpro.ru · Onest + Inter · Hero, Cases, CTA" viewport="1280x800" -->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AIVISION · Лендинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;background:#0A0A0A;color:#fff;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:#2A2A2A}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  brand:'#3F6EE8', emerald:'#10B981', crimson:'#F43F5E',
  sun:'#FCD34D', slate:'#94A3B8',
};
const T = {
  bg:'#0A0A0A', surface:'#181818', surfaceAlt:'#222222',
  border:'#2A2A2A', textPrimary:'#FFFFFF',
  textSecondary:'#A3A3A3', textMuted:'#666666',
};

const ch = px => ({ clipPath:`polygon(0 0,100% 0,100% calc(100% - ${px}px),calc(100% - ${px}px) 100%,0 100%)` });

function Logo({ size=24, dark=false }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
      <svg width={size} height={size} viewBox="0 0 256 256">
        <path d="M 0 0 L 256 0 L 256 208 L 208 256 L 0 256 Z" fill={dark ? '#0A0A0A' : C.brand}/>
      </svg>
      <span style={{ fontFamily:'IBM Plex Sans', fontWeight:700, fontSize:13, letterSpacing:'0.15em', textTransform:'uppercase', color: dark ? '#0A0A0A' : '#fff' }}>AIVISION</span>
    </div>
  );
}

function Eyebrow({ children, color }) {
  return (
    <div style={{ display:'inline-flex', alignItems:'center', gap:10, fontSize:11, fontWeight:600, letterSpacing:'0.15em', textTransform:'uppercase', color: color || T.textSecondary }}>
      <span style={{ width:24, height:1, background: color || C.brand, flexShrink:0 }}/>
      {children}
    </div>
  );
}

function Btn({ children, variant='primary', size='md', onClick }) {
  const [hov, setHov] = useState(false);
  const h = size === 'lg' ? 52 : size === 'sm' ? 34 : 44;
  const fs = size === 'lg' ? 13 : size === 'sm' ? 11 : 13;
  const px = size === 'lg' ? 28 : size === 'sm' ? 16 : 20;
  const bg = variant==='primary' ? (hov ? '#5A85F0' : C.brand) : (hov ? '#222' : 'transparent');
  const color = variant==='primary' ? '#fff' : T.textSecondary;
  return (
    <button onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={onClick} style={{
      display:'inline-flex', alignItems:'center', gap:8,
      height:h, padding:`0 ${px}px`,
      fontSize:fs, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase',
      fontFamily:'IBM Plex Sans', background:bg, color,
      border:'none', cursor:'pointer', transition:'background .15s',
      ...ch(size==='lg' ? 10 : 8),
    }}>{children}</button>
  );
}

function StatCard({ num, label, color }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:48, fontWeight:500, letterSpacing:'-0.02em', lineHeight:1.0, color: color || C.brand, fontVariantNumeric:'tabular-nums' }}>{num}</div>
      <div style={{ fontSize:13, color:T.textSecondary, lineHeight:1.4 }}>{label}</div>
    </div>
  );
}

function CaseCard({ tag, title, italicWord, stats, onClick }) {
  const [hov, setHov] = useState(false);
  const titleParts = title.split(italicWord);
  return (
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={onClick}
      style={{ background: hov ? T.surface : T.surfaceAlt, padding:28, cursor:'pointer', transition:'background .15s', ...ch(12) }}>
      <div style={{ marginBottom:16 }}>
        <span style={{ display:'inline-flex', padding:'3px 8px', fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', background:'rgba(63,110,232,0.15)', color:C.brand, ...ch(4) }}>{tag}</span>
      </div>
      <h3 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:24, fontWeight:500, letterSpacing:'-0.015em', lineHeight:1.2, marginBottom:18 }}>
        {titleParts[0]}<span style={{ color:C.brand }}>{italicWord}</span>{titleParts[1]}
      </h3>
      <div style={{ display:'flex', gap:24, paddingTop:18, borderTop:`1px solid ${T.border}` }}>
        {stats.map((s,i) => (
          <div key={i}>
            <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:28, fontWeight:500, color: s.color || '#fff', fontVariantNumeric:'tabular-nums' }}>{s.val}</div>
            <div style={{ fontSize:11, color:T.textMuted, marginTop:3 }}>{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── CASE PAGE ──────────────────────────────────────────────────── */
function CasePage({ onBack }) {
  return (
    <div style={{ maxWidth:800, margin:'0 auto', padding:'64px 24px' }}>
      <button onClick={onBack} style={{ display:'inline-flex', alignItems:'center', gap:8, fontSize:12, color:T.textSecondary, background:'none', border:'none', cursor:'pointer', fontFamily:'IBM Plex Sans', marginBottom:40 }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
        Назад
      </button>
      <Eyebrow>Кейс · Строительный холдинг</Eyebrow>
      <h1 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:56, fontWeight:500, letterSpacing:'-0.022em', lineHeight:1.05, margin:'16px 0 24px' }}>
        Большой оборот, <span style={{ color:C.brand }}>нулевая прозрачность</span>: четыре проекта и ноль управляемости
      </h1>
      <p style={{ fontSize:17, color:T.textSecondary, lineHeight:1.7, marginBottom:48 }}>
        Строительный холдинг — 4 объекта одновременно, 200+ сотрудников, 40М ₽/мес оборота. Собственник видел оборот, но не видел маржи.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20, marginBottom:48, padding:28, background:T.surface, ...ch(12) }}>
        {[{val:'+93%', label:'Маржа за 3 мес.', color:C.emerald},{val:'−32%', label:'Расходы на АХО', color:C.crimson},{val:'4 PnL', label:'Финансовых отчёта', color:C.brand}].map((s,i)=>(
          <div key={i}>
            <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:40, fontWeight:500, letterSpacing:'-0.02em', lineHeight:1.0, color:s.color, fontVariantNumeric:'tabular-nums' }}>{s.val}</div>
            <div style={{ fontSize:11, color:T.textMuted, marginTop:6, letterSpacing:'0.04em' }}>{s.label}</div>
          </div>
        ))}
      </div>
      {[
        { label:'Точка А', color:C.crimson, text:'Собственник принимал решения на ощущениях. «Денег много — значит всё хорошо» — до первого кассового разрыва.' },
        { label:'Что сделали', color:C.brand, text:'Внедрили управленческий учёт по всем 4 объектам. Настроили единый дашборд: маржа → доходы → расходы в реальном времени. Построили воронку продаж.' },
        { label:'Точка Б', color:C.emerald, text:'За 90 дней собственник видит маржу каждого объекта. Кассовый разрыв стал управляемым. Команда работает по KPI.' },
      ].map((s,i) => (
        <div key={i} style={{ marginBottom:28, padding:24, borderLeft:`3px solid ${s.color}`, background:T.surface, ...ch(10) }}>
          <Eyebrow color={s.color}>{s.label}</Eyebrow>
          <p style={{ fontSize:15, color:T.textSecondary, lineHeight:1.7, marginTop:12 }}>{s.text}</p>
        </div>
      ))}
    </div>
  );
}

/* ─── HOME PAGE ──────────────────────────────────────────────────── */
function HomePage({ onCase }) {
  return (
    <div>
      {/* Hero */}
      <section style={{ padding:'96px 0 80px', maxWidth:960, margin:'0 auto', paddingLeft:48, paddingRight:48 }}>
        <div className="fade-up" style={{ marginBottom:24 }}><Eyebrow>Система управляемой прибыли</Eyebrow></div>
        <h1 className="fade-up" style={{ animationDelay:'.1s', fontFamily:'Onest, system-ui, sans-serif', fontSize:'clamp(48px,7vw,80px)', fontWeight:500, letterSpacing:'-0.025em', lineHeight:1.0, marginBottom:28, maxWidth:820 }}>
          Бизнес стал <span style={{ color:C.brand }}>управляемым</span> — за 30 дней.
        </h1>
        <p className="fade-up" style={{ animationDelay:'.2s', fontSize:17, color:T.textSecondary, lineHeight:1.7, maxWidth:560, marginBottom:40 }}>
          Строим управленческие системы для бизнеса от 10 млн ₽/мес: KPI, управленческий учёт, CRM. Даём собственнику видимость и контроль над маржой.
        </p>
        <div className="fade-up" style={{ animationDelay:'.3s', display:'flex', gap:12, flexWrap:'wrap' }}>
          <Btn size="lg">Разобрать бизнес</Btn>
          <Btn variant="ghost" size="lg">Смотреть кейсы</Btn>
        </div>
      </section>

      {/* Stats strip */}
      <section style={{ borderTop:`1px solid ${T.border}`, borderBottom:`1px solid ${T.border}` }}>
        <div style={{ maxWidth:960, margin:'0 auto', padding:'48px', display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:32 }}>
          <StatCard num="200+" label="Бизнесов запустили систему" color={C.brand}/>
          <StatCard num="+93%" label="Средний рост маржи за 90 дней" color={C.emerald}/>
          <StatCard num="−32%" label="Снижение АХО-расходов" color={C.crimson}/>
          <StatCard num="30 дн." label="До первого управленческого отчёта" color={C.sun}/>
        </div>
      </section>

      {/* Cases */}
      <section style={{ padding:'80px 48px', maxWidth:960, margin:'0 auto' }}>
        <div style={{ marginBottom:40 }}><Eyebrow>Кейсы</Eyebrow></div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
          <CaseCard tag="Строительство" title="Большой оборот, нулевая прозрачность" italicWord="нулевая прозрачность" stats={[{val:'+93%',label:'Маржа',color:C.emerald},{val:'−32%',label:'Расходы',color:C.crimson}]} onClick={onCase}/>
          <CaseCard tag="Ритейл" title="Ручное управление начинает стоить миллионы" italicWord="ручное управление" stats={[{val:'+200%',label:'Скорость решений',color:C.brand},{val:'×4',label:'PnL проектов',color:C.sun}]} onClick={onCase}/>
          <CaseCard tag="IT-сервисы" title="Бизнес дорос до того момента, когда нужна система" italicWord="нужна система" stats={[{val:'3 мес.',label:'До результата',color:C.brand},{val:'40М ₽',label:'В управлении',color:C.emerald}]} onClick={onCase}/>
        </div>
      </section>

      {/* Products */}
      <section style={{ padding:'0 48px 80px', maxWidth:960, margin:'0 auto' }}>
        <div style={{ marginBottom:32 }}><Eyebrow>Продукты</Eyebrow></div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          {[
            { title:'Управленческий консалтинг', desc:'Диагностика бизнеса, внедрение KPI, управленческий учёт, финансовая модель. 90 дней до системы.', tag:'Услуга' },
            { title:'AIVISION CRM', desc:'Готовая платформа для управления воронкой, финансами и задачами. Клон на вашем домене за 48 часов.', tag:'SaaS' },
          ].map((p,i) => (
            <div key={i} style={{ padding:28, background:T.surface, ...ch(12) }}>
              <span style={{ display:'inline-flex', padding:'3px 8px', fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', background:'rgba(63,110,232,0.15)', color:C.brand, ...ch(4), marginBottom:16 }}>{p.tag}</span>
              <h3 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:24, fontWeight:500, letterSpacing:'-0.015em', lineHeight:1.2, marginBottom:12 }}>{p.title}</h3>
              <p style={{ fontSize:14, color:T.textSecondary, lineHeight:1.65 }}>{p.desc}</p>
            </div>
          ))}
        </div>
      </section>

      {/* CTA */}
      <section style={{ padding:'0 48px 80px', maxWidth:960, margin:'0 auto' }}>
        <div style={{ background:C.brand, padding:'52px 48px', ...ch(16) }}>
        <Eyebrow color="rgba(255,255,255,0.6)">Диагностика</Eyebrow>
        <h2 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:40, fontWeight:500, letterSpacing:'-0.02em', lineHeight:1.1, margin:'16px 0 12px', maxWidth:580 }}>
          Разберём ваш бизнес — и покажем, где теряется маржа.
        </h2>
        <p style={{ fontSize:15, color:'rgba(255,255,255,0.75)', lineHeight:1.65, maxWidth:480, marginBottom:28 }}>
          Бесплатный разбор на 60 минут. Только для бизнеса от 10 млн ₽/мес.
        </p>
        <button style={{ height:48, padding:'0 24px', fontSize:13, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase', fontFamily:'IBM Plex Sans', background:'#fff', color:C.brand, border:'none', cursor:'pointer', ...ch(10) }}>
          Записаться на разбор
        </button>
        </div>
      </section>
    </div>
  );
}

/* ─── NAV + APP ──────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState('home');
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  return (
    <div style={{ minHeight:'100vh', background:T.bg }}>
      {/* Nav */}
      <nav style={{ position:'sticky', top:0, zIndex:50, borderBottom:`1px solid ${scrolled ? T.border : 'transparent'}`, background: scrolled ? 'rgba(10,10,10,0.92)' : 'transparent', backdropFilter: scrolled ? 'blur(12px)' : 'none', transition:'all .2s' }}>
        <div style={{ maxWidth:960, margin:'0 auto', padding:'0 48px', height:56, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <button onClick={()=>setPage('home')} style={{ background:'none', border:'none', cursor:'pointer', padding:0 }}><Logo/></button>
          <div style={{ display:'flex', alignItems:'center', gap:28 }}>
            {['Продукты','Кейсы','О нас'].map(l => (
              <button key={l} style={{ fontSize:13, fontWeight:500, color:T.textSecondary, background:'none', border:'none', cursor:'pointer', fontFamily:'IBM Plex Sans', transition:'color .15s' }}
                onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color=T.textSecondary}>{l}</button>
            ))}
            <Btn size="sm" onClick={()=>{}}>Начать диагностику</Btn>
          </div>
        </div>
      </nav>
      {page === 'home' ? <HomePage onCase={()=>setPage('case')}/> : <CasePage onBack={()=>setPage('home')}/>}
      {/* Footer */}
      <footer style={{ borderTop:`1px solid ${T.border}`, padding:'32px 48px', maxWidth:960, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <Logo/>
        <div style={{ fontSize:12, color:T.textMuted }}>© 2026 AIVISION · aivisionpro.ru</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
