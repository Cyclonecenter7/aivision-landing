# ── Landing dev ──────────────────────────────
server {
    server_name aivisiontest.ru www.aivisiontest.ru;
    root /var/www/aivision-landing-dev/dist;

    include /etc/nginx/snippets/aivision-security-dev.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 301 редиректы со старых case-URL (миграция SEO-веса)
    location = /case/1 { return 301 /cases/education/; }
    location = /case/1/ { return 301 /cases/education/; }
    location = /case/2 { return 301 /cases/construction/; }
    location = /case/2/ { return 301 /cases/construction/; }
    location = /case/3 { return 301 /cases/ecommerce/; }
    location = /case/3/ { return 301 /cases/ecommerce/; }

    location = /index.html {
        include /etc/nginx/snippets/aivision-security-dev.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        include /etc/nginx/snippets/aivision-security-dev.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /demo/ {
        include /etc/nginx/snippets/aivision-security-dev.conf;
        try_files $uri $uri/ /demo/index.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aivisiontest.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aivisiontest.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
