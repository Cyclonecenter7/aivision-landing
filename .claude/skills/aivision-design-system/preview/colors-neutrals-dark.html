<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Dark Neutrals" subtitle="bg · surface · surface-alt · border · text dark theme" viewport="700x240" -->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.swatch{overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
.chip{width:100%;height:40px;border:1px solid rgba(255,255,255,0.06);}
.meta{background:#181818;padding:8px 10px 10px;}
.name{font-size:10px;font-weight:600;color:#fff;margin-bottom:2px;}
.hex{font-size:10px;color:#666;font-family:'SF Mono',monospace;}
.role{font-size:10px;color:#A3A3A3;margin-top:4px;}
.label{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#666;margin-bottom:10px;}
</style>
</head>
<body>
<div class="label">Dark Theme — Surfaces</div>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#0A0A0A;"></div><div class="meta"><div class="name">bg</div><div class="hex">#0A0A0A</div><div class="role">Главный фон</div></div></div>
  <div class="swatch"><div class="chip" style="background:#181818;"></div><div class="meta"><div class="name">surface</div><div class="hex">#181818</div><div class="role">Карточки, панели</div></div></div>
  <div class="swatch"><div class="chip" style="background:#222222;"></div><div class="meta"><div class="name">surface-alt</div><div class="hex">#222222</div><div class="role">Ховер, thead</div></div></div>
  <div class="swatch"><div class="chip" style="background:#2A2A2A;"></div><div class="meta"><div class="name">border</div><div class="hex">#2A2A2A</div><div class="role">Разделители</div></div></div>
</div>
<div class="grid2">
  <div class="swatch"><div class="chip" style="background:#FFFFFF;"></div><div class="meta"><div class="name">text-primary</div><div class="hex">#FFFFFF</div><div class="role">Основной текст</div></div></div>
  <div class="swatch"><div class="chip" style="background:#A3A3A3;"></div><div class="meta"><div class="name">text-secondary</div><div class="hex">#A3A3A3</div><div class="role">Вторичный текст</div></div></div>
  <div class="swatch"><div class="chip" style="background:#666666;"></div><div class="meta"><div class="name">text-muted</div><div class="hex">#666666</div><div class="role">Eyebrow, hex, дата</div></div></div>
</div>
</body>
</html>
