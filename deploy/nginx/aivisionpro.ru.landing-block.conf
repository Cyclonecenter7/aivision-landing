server {
    server_name aivisionpro.ru www.aivisionpro.ru;

    root /var/www/aivision-landing/dist;
    index index.html;

    include /etc/nginx/snippets/aivision-security-prod.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 301 редиректы со старых case-URL (миграция SEO-веса)
    location = /case/1 { return 301 /cases/education/; }
    location = /case/1/ { return 301 /cases/education/; }
    location = /case/2 { return 301 /cases/construction/; }
    location = /case/2/ { return 301 /cases/construction/; }
    location = /case/3 { return 301 /cases/ecommerce/; }
    location = /case/3/ { return 301 /cases/ecommerce/; }

    location /api/ {
        include /etc/nginx/snippets/aivision-security-prod.conf;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        include /etc/nginx/snippets/aivision-security-prod.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=86400, stale-while-revalidate=604800" always;
    }
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        include /etc/nginx/snippets/aivision-security-prod.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /demo/ {
        include /etc/nginx/snippets/aivision-security-prod.conf;
        try_files $uri $uri/ /demo/index.html;
    }
    location / {
        include /etc/nginx/snippets/aivision-security-prod.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=86400, stale-while-revalidate=604800" always;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aivisionpro.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aivisionpro.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
