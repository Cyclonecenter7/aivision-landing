<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AIVISION · Design System Reference</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  :root{--ease:cubic-bezier(.4,0,.2,1)}
  ::selection{background:#3F6EE8;color:#fff}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3A3A3A}
  body[data-theme="light"] ::-webkit-scrollbar-thumb{background:#D4D4D4}
  input,select,button,textarea{font-family:'Inter',sans-serif}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes barGrow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
  @keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  .anim{animation:fadeIn .3s var(--ease) both}
  .bar-anim{animation:barGrow .5s var(--ease) both}
  .toast-anim{animation:toastIn .3s var(--ease) both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════════════════════════════════
// ТЕМЫ — dark / light
// ═══════════════════════════════════════════════════════════════════

const THEMES = {
  dark: {
    bg:'#0A0A0A', surface:'#181818', surfaceAlt:'#222222',
    border:'#2A2A2A', borderStrong:'#3A3A3A',
    textPrimary:'#FFFFFF', textSecondary:'#A3A3A3', textMuted:'#666666',
    accent:'#3F6EE8', accentHover:'#5A85F0',
    chartGrid:'#222222',
  },
  light: {
    bg:'#FAFAFA', surface:'#FFFFFF', surfaceAlt:'#F4F4F4',
    border:'#E8E8E8', borderStrong:'#D4D4D4',
    textPrimary:'#0A0A0A', textSecondary:'#525252', textMuted:'#999999',
    accent:'#3F6EE8', accentHover:'#2D5BD4',
    chartGrid:'#EFEFEF',
  },
};

// ═══════════════════════════════════════════════════════════════════
// ПАЛИТРА AIVISION v1.0 — 7 цветов, закрытая система
// ═══════════════════════════════════════════════════════════════════
// СЕМАНТИКА (5) — фиксированный смысл, не используется для категорий
// КАТЕГОРИАЛЬНЫЕ (2) — без смысла, для отличия нейтральных категорий
// ═══════════════════════════════════════════════════════════════════

const C = {
  brand:     '#3F6EE8',  // маржа, бренд, primary CTA, "В работе"
  emerald:   '#10B981',  // доход, успех, "Завершена"
  crimson:   '#F43F5E',  // расход, провал, просрочка, ГОРЯЧИЙ ЛИД
  sun:       '#FCD34D',  // в процессе, "Связались", дедлайн, ТЁПЛЫЙ ЛИД
  slate:     '#94A3B8',  // нейтрально, "Недоступен", нет данных, ХОЛОДНЫЙ ЛИД
  indigo:    '#6366F1',  // категориальный — второй синий
  tangerine: '#FB923C',  // категориальный — тёплый акцент
};

// Семантические алиасы — для читаемости кода
const SEM = {
  success: C.emerald,
  danger:  C.crimson,
  warning: C.sun,
  info:    C.brand,
  neutral: C.slate,
};

// Heat — алиасы для CRM-классификации лидов
const HEAT = {
  hot:  C.crimson,   // горячий = срочно
  warm: C.sun,       // тёплый = в работе
  cold: C.slate,     // холодный = остыл
};

// ═══════════════════════════════════════════════════════════════════
// CHAMFER — фирменный скос угла
// ═══════════════════════════════════════════════════════════════════

const ch = (px=8) => ({
  clipPath:`polygon(0 0,100% 0,100% calc(100% - ${px}px),calc(100% - ${px}px) 100%,0 100%)`
});

// SVG-overlay для обводки на chamfer (border + clip-path несовместимы)
function ChamferBorder({ children, px=10, color, strokeWidth=1, style={} }) {
  const ref = useRef(null);
  const [d, setD] = useState({w:0,h:0});
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setD({w:e.contentRect.width,h:e.contentRect.height}));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  const { w, h } = d;
  const o = strokeWidth/2;
  const path = w&&h ? `M${o},${o} L${w-o},${o} L${w-o},${h-px} L${w-px},${h-o} L${o},${h-o} Z` : '';
  return (
    <div ref={ref} style={{position:'relative',...style}}>
      {children}
      {path && (
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'visible'}} viewBox={`0 0 ${w} ${h}`}>
          <path d={path} fill="none" stroke={color} strokeWidth={strokeWidth} vectorEffect="non-scaling-stroke"/>
        </svg>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SMOOTH PATH — Steffen monotone interpolation
// ═══════════════════════════════════════════════════════════════════
// Профессиональный стандарт для финансовых графиков (Apple, Stripe).
// Кривая плавная, но НИКОГДА не выходит за фактические значения.
// Подходит для KPI-спарклайнов и больших графиков "Маржа · Доходы · Расходы".
// ═══════════════════════════════════════════════════════════════════

function smoothPath(points) {
  const n = points.length;
  if (n < 2) return '';
  if (n === 2) return `M${points[0][0]},${points[0][1]} L${points[1][0]},${points[1][1]}`;

  // Вычисляем тангенсы (производные) в каждой точке
  const tangents = new Array(n);

  // Для каждой внутренней точки используем формулу Steffen
  for (let i = 1; i < n - 1; i++) {
    const dx1 = points[i][0] - points[i-1][0];
    const dx2 = points[i+1][0] - points[i][0];
    const dy1 = points[i][1] - points[i-1][1];
    const dy2 = points[i+1][1] - points[i][1];
    const s1 = dy1 / dx1;
    const s2 = dy2 / dx2;

    if (s1 * s2 <= 0) {
      tangents[i] = 0; // Локальный экстремум — горизонтальная касательная
    } else {
      const p = (s1 * dx2 + s2 * dx1) / (dx1 + dx2);
      tangents[i] = Math.sign(s1) * Math.min(Math.abs(s1), Math.abs(s2), 0.5 * Math.abs(p));
    }
  }
  // Концы — прямая касательная к соседу
  tangents[0] = (points[1][1] - points[0][1]) / (points[1][0] - points[0][0]);
  tangents[n-1] = (points[n-1][1] - points[n-2][1]) / (points[n-1][0] - points[n-2][0]);

  // Строим cubic Bezier из тангенсов
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (points[i+1][0] - points[i][0]) / 3;
    const cp1x = points[i][0] + dx;
    const cp1y = points[i][1] + tangents[i] * dx;
    const cp2x = points[i+1][0] - dx;
    const cp2y = points[i+1][1] - tangents[i+1] * dx;
    d += ` C${cp1x},${cp1y} ${cp2x},${cp2y} ${points[i+1][0]},${points[i+1][1]}`;
  }
  return d;
}

// ═══════════════════════════════════════════════════════════════════
// ФОРМАТ
// ═══════════════════════════════════════════════════════════════════

const fmtRub = (v) => new Intl.NumberFormat('ru-RU').format(Math.round(v)) + '\u00A0₽';
const fmtCompact = (v) => {
  if (Math.abs(v) >= 1e6) return (v/1e6).toFixed(1).replace('.',',') + 'M';
  if (Math.abs(v) >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return String(Math.round(v));
};

// ═══════════════════════════════════════════════════════════════════
// ЛОГО
// ═══════════════════════════════════════════════════════════════════

function Logo({ size=24, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 256 256">
      <path d="M 0 0 L 256 0 L 256 208 L 208 256 L 0 256 Z" fill={color || C.brand}/>
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HEAT ICON — миниатюра логомарки (3 заливки: filled / half / outline)
// ═══════════════════════════════════════════════════════════════════

function HeatIcon({ variant='hot', size=12 }) {
  const color = variant==='hot' ? HEAT.hot : variant==='warm' ? HEAT.warm : HEAT.cold;
  const path = 'M4 4 L28 4 L28 22 L22 28 L4 28 Z';
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none" style={{ flexShrink:0, color, marginRight:4 }}>
      {variant==='hot'  && <path d={path} fill="currentColor"/>}
      {variant==='warm' && (<>
        <path d={path} fill="currentColor" fillOpacity="0.35"/>
        <path d={path} stroke="currentColor" strokeWidth="3"/>
      </>)}
      {variant==='cold' && <path d={path} stroke="currentColor" strokeWidth="3"/>}
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════════
// EYEBROW — маленький лейбл с линией перед заголовком
// ═══════════════════════════════════════════════════════════════════

function Eyebrow({ children, t }) {
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:10,
      fontSize:11, fontWeight:500, letterSpacing:'0.14em', textTransform:'uppercase',
      color:t.textSecondary,
    }}>
      <span style={{ width:24, height:1, background:t.accent, flexShrink:0 }}/>
      {children}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SECTION — обёртка для секции витрины
// ═══════════════════════════════════════════════════════════════════

function Section({ id, label, title, children, t }) {
  return (
    <section id={id} style={{ padding:'56px 48px', borderBottom:`1px solid ${t.border}` }} className="anim">
      <div style={{ marginBottom:28 }}>
        <Eyebrow t={t}>{label}</Eyebrow>
        <h2 style={{ fontSize:24, fontWeight:700, lineHeight:1.2, marginTop:10, color:t.textPrimary, letterSpacing:'-0.01em' }}>{title}</h2>
      </div>
      {children}
    </section>
  );
}

// ═══════════════════════════════════════════════════════════════════
// BUTTON — primary / secondary / ghost / danger × sm/md/lg
// ═══════════════════════════════════════════════════════════════════

function Btn({ variant='primary', size='md', disabled, children, onClick, iconOnly, t }) {
  const [hover, setHover] = useState(false);
  const heights = { sm:32, md:40, lg:48 };
  const px = { sm:12, md:16, lg:20 };
  const fs = { sm:12, md:14, lg:15 };
  let bg, color;
  if (variant === 'primary') { bg = disabled ? t.border : hover ? t.accentHover : t.accent; color = disabled ? t.textMuted : '#fff'; }
  else if (variant === 'secondary') { bg = disabled ? t.surfaceAlt : hover ? t.borderStrong : t.surfaceAlt; color = disabled ? t.textMuted : t.textPrimary; }
  else if (variant === 'ghost') { bg = hover ? t.surfaceAlt : 'transparent'; color = disabled ? t.textMuted : t.textSecondary; }
  else if (variant === 'danger') { bg = disabled ? t.border : hover ? '#c5383d' : C.crimson; color = '#fff'; }
  return (
    <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
      height:heights[size], width: iconOnly ? heights[size] : 'auto',
      padding: iconOnly ? 0 : `0 ${px[size]}px`,
      fontSize:fs[size], fontWeight:500, fontFamily:'inherit',
      background:bg, color, border:'none',
      cursor: disabled ? 'not-allowed' : 'pointer',
      transition:'background .15s, color .15s', opacity: disabled ? 0.5 : 1,
      ...ch(8),
    }}>{children}</button>
  );
}

// ═══════════════════════════════════════════════════════════════════
// INPUT / TEXTAREA — chamfer-обводка через ChamferBorder
// ═══════════════════════════════════════════════════════════════════

function Input({ placeholder, value, onChange, state='default', prefix, t, multiline, rows=4 }) {
  const [focused, setFocused] = useState(false);
  const isError = state === 'error';
  const isDisabled = state === 'disabled';
  const borderColor = isError ? C.crimson : (focused || state === 'focused') ? t.accent : t.border;
  const strokeWidth = (focused || isError) ? 1.5 : 1;
  const Field = multiline ? 'textarea' : 'input';
  const fieldStyle = {
    width:'100%', background:t.surface, color:t.textPrimary,
    border:'none', outline:'none', fontSize:14, fontFamily:'inherit',
    fontVariantNumeric:'tabular-nums', ...ch(8),
    position:'relative', zIndex:1,
  };
  return (
    <ChamferBorder px={8} color={borderColor} strokeWidth={strokeWidth} style={{ opacity: isDisabled ? 0.5 : 1 }}>
      <div style={{ position:'relative', display:'flex', alignItems:'center' }}>
        {prefix && <span style={{ position:'absolute', left:12, color:t.textMuted, display:'flex', alignItems:'center', pointerEvents:'none', zIndex:2 }}>{prefix}</span>}
        <Field
          type={multiline ? undefined : 'text'}
          placeholder={placeholder}
          value={value || ''}
          onChange={onChange}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setFocused(false)}
          disabled={isDisabled}
          rows={multiline ? rows : undefined}
          style={multiline ? {
            ...fieldStyle, padding:'12px', minHeight:rows*20+24, resize:'vertical',
          } : {
            ...fieldStyle, height:40, padding: prefix ? '0 12px 0 36px' : '0 12px',
          }}
        />
      </div>
    </ChamferBorder>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SELECT — стилизованный нативный select под chamfer
// ═══════════════════════════════════════════════════════════════════

function Select({ value, onChange, options=[], t, state='default' }) {
  const [focused, setFocused] = useState(false);
  const borderColor = (focused || state === 'focused') ? t.accent : t.border;
  return (
    <ChamferBorder px={8} color={borderColor} strokeWidth={focused ? 1.5 : 1}>
      <div style={{ position:'relative' }}>
        <select value={value} onChange={onChange} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
          style={{
            width:'100%', height:40, padding:'0 36px 0 12px',
            background:t.surface, color:t.textPrimary,
            border:'none', outline:'none', fontSize:14, fontFamily:'inherit',
            appearance:'none', WebkitAppearance:'none', cursor:'pointer',
            ...ch(8), position:'relative', zIndex:1,
          }}>
          {options.map((o,i) => <option key={i} value={typeof o==='string' ? o : o.value}>{typeof o==='string' ? o : o.label}</option>)}
        </select>
        <span style={{
          position:'absolute', right:14, top:'50%',
          width:8, height:8,
          borderRight:`1.5px solid ${t.textSecondary}`,
          borderBottom:`1.5px solid ${t.textSecondary}`,
          transform:'translateY(-70%) rotate(45deg)',
          pointerEvents:'none', zIndex:3,
        }}/>
      </div>
    </ChamferBorder>
  );
}

// ═══════════════════════════════════════════════════════════════════
// TOGGLE — переключатель on/off
// ═══════════════════════════════════════════════════════════════════

function Toggle({ on, onChange, t }) {
  return (
    <div onClick={() => onChange(!on)} style={{
      width:40, height:22, background: on ? t.accent : t.border,
      position:'relative', cursor:'pointer', transition:'background .2s',
      borderRadius:11,
    }}>
      <div style={{
        position:'absolute', top:3, left: on ? 21 : 3,
        width:16, height:16, background:'#fff', borderRadius:'50%',
        transition:'left .2s var(--ease)',
        boxShadow:'0 1px 3px rgba(0,0,0,0.3)',
      }}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// TAG — универсальный тег с цветовой подложкой
// ═══════════════════════════════════════════════════════════════════

function Tag({ children, color, bg, t }) {
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'3px 8px', fontSize:11, fontWeight:500,
      background: bg || t.surfaceAlt, color: color || t.textSecondary,
      ...ch(6),
    }}>{children}</span>
  );
}

// ═══════════════════════════════════════════════════════════════════
// STATUS TAG — статусы заявок и сделок (по новой палитре)
// ═══════════════════════════════════════════════════════════════════
// Новая   → brand    (требует обработки, в воронке)
// Связались → sun    (контакт сделан, в работе)
// В работе → brand fill + white text  (активная сделка)
// Недоступен → slate (не отвечает)
// Не целевой → slate (вне ICP)
// Завершена → emerald (закрыта успешно)
// Провалена → crimson (реальная ошибка)
// ═══════════════════════════════════════════════════════════════════

const STATUS_STYLE = {
  'Новая':       { fg:C.brand,    bgAlpha:0.15 },
  'Связались':   { fg:C.sun,      bgAlpha:0.18 },
  'В работе':    { fg:'#fff',     bgSolid:C.brand },
  'Недоступен':  { fg:C.slate,    bgAlpha:0.18 },
  'Не целевой':  { fg:C.slate,    bgAlpha:0.18 },
  'Завершена':   { fg:C.emerald,  bgAlpha:0.15 },
  'Провалена':   { fg:C.crimson,  bgAlpha:0.15 },
};

function StatusTag({ status }) {
  const s = STATUS_STYLE[status] || { fg:'#888', bgAlpha:0.1 };
  const hex = s.fg.startsWith('#') ? s.fg : C.brand;
  const bg = s.bgSolid || (() => {
    // hex → rgba
    const h = hex.replace('#','');
    const r = parseInt(h.slice(0,2),16);
    const g = parseInt(h.slice(2,4),16);
    const b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${s.bgAlpha})`;
  })();
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'3px 8px', fontSize:11, fontWeight:600,
      background: bg, color: s.fg,
      ...ch(6),
    }}>{status}</span>
  );
}

// ═══════════════════════════════════════════════════════════════════
// KPI CARD — обычная и highlighted (бренд)
// ═══════════════════════════════════════════════════════════════════
// Спарклайн рисуется через monotone smoothPath, заливка — линейный градиент.
// ═══════════════════════════════════════════════════════════════════

function KpiCard({ label, value, delta, deltaPos, sub, sparkData, sparkColor, accent, progress, forecast, variant, t }) {
  const wrap = useRef(null);
  const [w, setW] = useState(220);
  useEffect(() => { if (wrap.current) setW(wrap.current.offsetWidth) }, []);

  if (variant === 'empty') return (
    <div ref={wrap} style={{
      background:t.surface, ...ch(10), padding:'20px',
      minHeight:140, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8,
    }}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={t.textMuted} strokeWidth="1.5">
        <path d="M3 3v18h18"/><path d="M18.4 9.6C16 7 12 6 9.5 8.5S6.5 15 9 17.5"/>
      </svg>
      <div style={{ fontSize:12, color:t.textMuted, textAlign:'center' }}>Нет данных<br/>за период</div>
    </div>
  );

  const sparkH = 36;
  const padX = 20;
  const sparkW = w - padX*2;

  let smoothLine = '', smoothArea = '';
  if (sparkData && sparkData.length > 1 && sparkW > 0) {
    const mn = Math.min(...sparkData), mx = Math.max(...sparkData);
    const range = (mx - mn) || 1;
    const coords = sparkData.map((v,i) => [
      (i/(sparkData.length-1)) * sparkW,
      sparkH - ((v - mn) / range) * sparkH * 0.85 - 3,
    ]);
    smoothLine = smoothPath(coords);
    smoothArea = smoothLine + ` L${coords[coords.length-1][0]},${sparkH} L${coords[0][0]},${sparkH} Z`;
  }

  const bg = accent ? t.accent : t.surface;
  const fg = accent ? '#fff' : t.textPrimary;
  const fgSub = accent ? 'rgba(255,255,255,0.7)' : t.textMuted;
  const lineColor = sparkColor || (accent ? 'rgba(255,255,255,0.9)' : t.accent);
  const gradId = `kpigrad-${Math.round(w)}-${(label||'').replace(/\s/g,'')}-${(sparkColor||'').replace('#','')}`;

  return (
    <div ref={wrap} style={{
      background:bg, ...ch(10),
      padding:`18px ${padX}px 0`, minHeight:140,
      display:'flex', flexDirection:'column', gap:6, overflow:'hidden',
    }}>
      <div style={{ fontSize:10, fontWeight:500, letterSpacing:'0.14em', textTransform:'uppercase', color:fgSub }}>{label}</div>
      <div style={{
        fontSize:26, fontWeight:700, letterSpacing:'-0.025em', color:fg,
        fontVariantNumeric:'tabular-nums', lineHeight:1.1,
        whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
      }}>{value}</div>
      <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, fontVariantNumeric:'tabular-nums' }}>
        {delta && (
          <span style={{ fontWeight:600, color: accent ? 'rgba(255,255,255,0.9)' : (deltaPos ? C.emerald : C.crimson) }}>
            {deltaPos ? '↑\u00A0+' : '↓\u00A0−'}{delta.replace(/^[+−-]/,'')}
          </span>
        )}
        {sub && <span style={{ color:fgSub }}>{sub}</span>}
      </div>
      {forecast && <div style={{ fontSize:11, color:fgSub }}>Прогноз: {forecast}</div>}
      {accent && progress !== undefined && (
        <div style={{ marginTop:6, height:4, background:'rgba(255,255,255,0.2)', position:'relative' }}>
          <div style={{ position:'absolute', inset:0, width:`${Math.min(progress,100)}%`, background:'#fff' }}/>
        </div>
      )}
      {sparkData && sparkW > 0 && (
        <div style={{ marginTop:'auto', marginLeft:-padX, marginRight:-padX, height:sparkH, position:'relative' }}>
          <svg width="100%" height={sparkH} viewBox={`0 0 ${sparkW} ${sparkH}`} preserveAspectRatio="none" style={{ display:'block', overflow:'visible' }}>
            <defs>
              <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stopColor={lineColor} stopOpacity={accent ? 0.4 : 0.25}/>
                <stop offset="100%" stopColor={lineColor} stopOpacity="0"/>
              </linearGradient>
            </defs>
            <path d={smoothArea} fill={`url(#${gradId})`}/>
            <path d={smoothLine} fill="none" stroke={lineColor} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LINE CHART — Маржа · Доходы · Расходы
// ═══════════════════════════════════════════════════════════════════
// Кривые через Steffen monotone — плавные, но не выходят за данные.
// Сетка с пунктиром, hover-tooltip с полным значением.
// ═══════════════════════════════════════════════════════════════════

function LineChart({ series, labels, t, height=280, formatTick }) {
  const wrap = useRef(null);
  const [w, setW] = useState(800);
  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setW(e.contentRect.width));
    if (wrap.current) ro.observe(wrap.current);
    return () => ro.disconnect();
  }, []);
  const [hover, setHover] = useState(null);

  const padL = 56, padR = 24, padT = 24, padB = 32;
  const innerW = Math.max(w - padL - padR, 0);
  const innerH = height - padT - padB;

  const allValues = series.flatMap(s => s.data);
  const maxV = Math.max(...allValues, 0);
  const niceMax = (() => {
    if (maxV === 0) return 100;
    const exp = Math.pow(10, Math.floor(Math.log10(maxV)));
    const m = maxV / exp;
    return (m <= 2 ? 2 : m <= 5 ? 5 : 10) * exp;
  })();

  const tickValues = Array.from({length:5}, (_,i) => (niceMax/4)*i);
  const xStep = labels.length > 1 ? innerW / (labels.length - 1) : 0;
  const xy = (i, v) => [padL + i*xStep, padT + innerH - (v/niceMax)*innerH];
  const fmt = formatTick || fmtCompact;

  return (
    <div ref={wrap} style={{ position:'relative', width:'100%' }}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{ display:'block', overflow:'visible' }}>
        <defs>
          {series.map((s,si) => (
            <linearGradient key={si} id={`lc-${si}-${Math.round(w)}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stopColor={s.color} stopOpacity="0.25"/>
              <stop offset="100%" stopColor={s.color} stopOpacity="0"/>
            </linearGradient>
          ))}
        </defs>

        {tickValues.map((tv,i) => {
          const y = padT + innerH - (tv/niceMax)*innerH;
          return (
            <g key={i}>
              <line x1={padL} x2={w-padR} y1={y} y2={y}
                stroke={t.chartGrid} strokeWidth="1"
                strokeDasharray={i===0 ? '' : '2 4'}/>
              <text x={padL-10} y={y+4} fontSize="10" textAnchor="end"
                fill={t.textMuted} fontFamily="Inter"
                style={{fontVariantNumeric:'tabular-nums'}}>{fmt(tv)}</text>
            </g>
          );
        })}

        {labels.map((lab,i) => (
          <text key={i} x={padL+i*xStep} y={height-8} fontSize="10" textAnchor="middle"
            fill={t.textMuted} fontFamily="Inter">{lab}</text>
        ))}

        {series.map((s,si) => {
          const pts = s.data.map((v,i) => xy(i,v));
          const linePath = smoothPath(pts);
          const baseY = padT + innerH;
          const areaPath = `${linePath} L${pts[pts.length-1][0]},${baseY} L${pts[0][0]},${baseY} Z`;
          return (
            <g key={si}>
              <path d={areaPath} fill={`url(#lc-${si}-${Math.round(w)})`}/>
              <path d={linePath} fill="none" stroke={s.color} strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"/>
              {pts.map((p,i) => (
                <circle key={i} cx={p[0]} cy={p[1]} r={hover===i?4.5:3} fill={t.surface} stroke={s.color} strokeWidth="2" style={{transition:'r .15s'}}/>
              ))}
            </g>
          );
        })}

        {labels.map((_,i) => (
          <rect key={i} x={padL+i*xStep-xStep/2} y={padT} width={xStep} height={innerH}
            fill="transparent"
            onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>
        ))}
        {hover !== null && (
          <line x1={padL+hover*xStep} x2={padL+hover*xStep} y1={padT} y2={padT+innerH}
            stroke={t.borderStrong} strokeWidth="1" strokeDasharray="3 3"/>
        )}
      </svg>

      {hover !== null && (
        <div style={{
          position:'absolute', left:padL+hover*xStep, top:0, transform:'translateX(-50%)',
          background:t.surfaceAlt, padding:'8px 12px', ...ch(6),
          fontSize:11, color:t.textPrimary, pointerEvents:'none',
          boxShadow:'0 4px 16px rgba(0,0,0,0.4)', zIndex:5, minWidth:140,
        }}>
          <div style={{ fontSize:10, color:t.textMuted, marginBottom:4 }}>{labels[hover]}</div>
          {series.map((s,i) => (
            <div key={i} style={{ display:'flex', alignItems:'center', gap:6, fontVariantNumeric:'tabular-nums' }}>
              <span style={{ width:8, height:8, background:s.color, flexShrink:0, borderRadius:'50%' }}/>
              <span style={{ color:t.textSecondary, fontSize:11 }}>{s.name}</span>
              <span style={{ marginLeft:'auto', fontWeight:600 }}>{fmtRub(s.data[hover])}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ display:'flex', justifyContent:'center', gap:24, marginTop:8 }}>
        {series.map((s,i) => (
          <div key={i} style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:8, height:8, background:s.color, flexShrink:0, borderRadius:'50%' }}/>
            <span style={{ fontSize:11, color:t.textSecondary }}>{s.name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// BARS — столбчатый график со скосом справа сверху
// ═══════════════════════════════════════════════════════════════════

function Bars({ data, t, color }) {
  const max = Math.max(...data.map(d => d.v));
  const topRightCh = (px=6) => ({
    clipPath:`polygon(0 0,calc(100% - ${px}px) 0,100% ${px}px,100% 100%,0 100%)`
  });
  return (
    <div style={{ display:'grid', gridTemplateColumns:`repeat(${data.length},1fr)`, gap:8, height:140, alignItems:'end' }}>
      {data.map((d,i) => {
        const pct = Math.max((d.v / max) * 100, 4);
        return (
          <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6, height:'100%', justifyContent:'flex-end' }}>
            <div style={{ fontSize:10, color:t.textMuted, fontVariantNumeric:'tabular-nums' }}>{fmtCompact(d.v)}</div>
            <div className="bar-anim" style={{
              width:'100%', height:`${pct}%`, flexShrink:0,
              background: color || t.accent, ...topRightCh(6),
            }}/>
            <div style={{ fontSize:10, color:t.textMuted }}>{d.k}</div>
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// DONUT — кольцевая диаграмма без белого контура между сегментами
// ═══════════════════════════════════════════════════════════════════

function Donut({ data, size=170, center, t }) {
  const total = data.reduce((s,d) => s+d.value, 0);
  const R = 62, r = 42;
  let angle = -Math.PI/2;
  const cx = size/2, cy = size/2;
  return (
    <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {data.map((d,i) => {
          const slice = (d.value/total) * Math.PI * 2;
          const x1 = cx + R*Math.cos(angle), y1 = cy + R*Math.sin(angle);
          const x2 = cx + R*Math.cos(angle+slice), y2 = cy + R*Math.sin(angle+slice);
          const xi1 = cx + r*Math.cos(angle+slice), yi1 = cy + r*Math.sin(angle+slice);
          const xi2 = cx + r*Math.cos(angle), yi2 = cy + r*Math.sin(angle);
          const large = slice > Math.PI ? 1 : 0;
          const path = `M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${xi1},${yi1} A${r},${r} 0 ${large} 0 ${xi2},${yi2} Z`;
          angle += slice;
          return <path key={i} d={path} fill={d.color} stroke={t.surface} strokeWidth="1"/>;
        })}
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <div style={{ fontSize:24, fontWeight:700, color:t.textPrimary, fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em' }}>{center?.value || total}</div>
        <div style={{ fontSize:10, color:t.textMuted, letterSpacing:'0.12em', textTransform:'uppercase', marginTop:2 }}>{center?.label || 'всего'}</div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// TABLE — CRM-таблица заявок с сортировкой и пагинацией
// ═══════════════════════════════════════════════════════════════════

function Table({ rows, t }) {
  const [sort, setSort] = useState(null);
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const perPage = 4;
  const cols = ['Имя','Контакт','Статус','Источник','Дата'];

  const sorted = [...rows].sort((a,b) => {
    if (!sort) return 0;
    const av = a[sort], bv = b[sort];
    return sortDir === 'asc' ? (av > bv ? 1:-1) : (av < bv ? 1:-1);
  });
  const paged = sorted.slice((page-1)*perPage, page*perPage);
  const pages = Math.ceil(rows.length / perPage);

  return (
    <div style={{ background:t.surface, ...ch(10), overflow:'hidden' }}>
      <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ background:t.surfaceAlt }}>
              {cols.map(c => (
                <th key={c} onClick={() => {
                  if (sort === c) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
                  else { setSort(c); setSortDir('asc'); }
                }} style={{
                  padding:'10px 14px', textAlign:'left',
                  fontSize:11, fontWeight:500, letterSpacing:'0.1em', textTransform:'uppercase',
                  color:t.textSecondary, cursor:'pointer', whiteSpace:'nowrap', userSelect:'none',
                }}>
                  {c} {sort===c && <span style={{ fontSize:9 }}>{sortDir==='asc' ? '▲' : '▼'}</span>}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {paged.length === 0 ? (
              <tr><td colSpan={cols.length} style={{ padding:'32px', textAlign:'center', color:t.textMuted }}>Нет заявок</td></tr>
            ) : paged.map((row, i) => (
              <tr key={i} style={{ borderTop:`1px solid ${t.border}`, transition:'background .15s' }}
                onMouseEnter={e => e.currentTarget.style.background = t.surfaceAlt}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <td style={{ padding:'12px 14px', color:t.textPrimary, fontWeight:500 }}>{row['Имя']}</td>
                <td style={{ padding:'12px 14px', color:t.textSecondary, fontVariantNumeric:'tabular-nums' }}>{row['Контакт']}</td>
                <td style={{ padding:'12px 14px' }}><StatusTag status={row['Статус']}/></td>
                <td style={{ padding:'12px 14px' }}><Tag t={t}>{row['Источник']}</Tag></td>
                <td style={{ padding:'12px 14px', color:t.textMuted, fontSize:12, fontVariantNumeric:'tabular-nums' }}>{row['Дата']}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 14px', borderTop:`1px solid ${t.border}`, background:t.surfaceAlt }}>
        <span style={{ fontSize:12, color:t.textMuted }}>{rows.length} записей</span>
        <div style={{ display:'flex', gap:4 }}>
          {Array.from({length:pages},(_,i) => i+1).map(p => (
            <button key={p} onClick={() => setPage(p)} style={{
              width:28, height:28,
              background: p===page ? t.accent : 'transparent',
              color: p===page ? '#fff' : t.textSecondary,
              border:'none', cursor:'pointer', fontSize:12, fontFamily:'inherit',
              ...ch(6),
            }}>{p}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// PERIOD TABS — кнопки-табы + кастомный календарь
// ═══════════════════════════════════════════════════════════════════
// Сегодня · Неделя · Этот месяц + «Свой период» (popover-календарь).
// ═══════════════════════════════════════════════════════════════════

function PeriodTabs({ value, customRange, onChange, t }) {
  const [calOpen, setCalOpen] = useState(false);
  const [viewMonth, setViewMonth] = useState(() => {
    const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1);
  });
  const [pendingStart, setPendingStart] = useState(null);
  const [pendingEnd, setPendingEnd] = useState(null);
  const [hoverDate, setHoverDate] = useState(null);

  const tabs = [
    { id:'today', label:'Сегодня' },
    { id:'week',  label:'Неделя'  },
    { id:'month', label:'Этот месяц' },
  ];
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const isCustomActive = value === 'custom';

  const fmtRange = (s, e) => {
    if (!s) return 'Свой период';
    const sStr = `${s.getDate().toString().padStart(2,'0')}.${(s.getMonth()+1).toString().padStart(2,'0')}`;
    if (!e || +s === +e) return sStr;
    const eStr = `${e.getDate().toString().padStart(2,'0')}.${(e.getMonth()+1).toString().padStart(2,'0')}`;
    return `${sStr} — ${eStr}`;
  };

  const buildGrid = (firstOfMonth) => {
    const y = firstOfMonth.getFullYear(), m = firstOfMonth.getMonth();
    let firstDow = new Date(y, m, 1).getDay();
    firstDow = firstDow === 0 ? 6 : firstDow - 1;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(y, m, d));
    while (cells.length % 7) cells.push(null);
    return cells;
  };
  const grid = buildGrid(viewMonth);
  const sameDay = (a, b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const today = new Date();

  const inRange = (d) => {
    if (!d) return false;
    const s = pendingStart, e = pendingEnd || hoverDate;
    if (!s) return false;
    if (!e) return sameDay(d, s);
    const a = +s < +e ? s : e;
    const b = +s < +e ? e : s;
    return +d >= +a && +d <= +b;
  };

  const handleDayClick = (d) => {
    if (!d) return;
    if (!pendingStart || (pendingStart && pendingEnd)) {
      setPendingStart(d); setPendingEnd(null);
    } else {
      const start = +pendingStart < +d ? pendingStart : d;
      const end = +pendingStart < +d ? d : pendingStart;
      setPendingEnd(end);
      onChange('custom', { start, end });
      setTimeout(() => setCalOpen(false), 150);
    }
  };

  const reset = () => {
    setPendingStart(null); setPendingEnd(null); setHoverDate(null);
    onChange('month');
    setCalOpen(false);
  };

  return (
    <div style={{ display:'flex', alignItems:'center', gap:6 }}>
      <div style={{ display:'flex', background:t.surfaceAlt, padding:3, gap:2, ...ch(8) }}>
        {tabs.map(tab => {
          const active = value === tab.id;
          return (
            <button key={tab.id} onClick={()=>{setPendingStart(null);setPendingEnd(null);onChange(tab.id);}}
              style={{
                height:30, padding:'0 14px', fontSize:12, fontWeight: active ? 600 : 500,
                background: active ? t.surface : 'transparent',
                color: active ? t.textPrimary : t.textSecondary,
                border:'none', cursor:'pointer', fontFamily:'inherit',
                ...ch(6),
              }}>{tab.label}</button>
          );
        })}
      </div>

      <div style={{ position:'relative' }}>
        <button onClick={()=>setCalOpen(!calOpen)} style={{
          height:36, padding:'0 12px', display:'inline-flex', alignItems:'center', gap:8,
          background: isCustomActive ? t.accent : t.surfaceAlt,
          color: isCustomActive ? '#fff' : t.textPrimary,
          fontSize:12, fontWeight:500,
          cursor:'pointer', fontFamily:'inherit', border:'none', ...ch(8),
        }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          {isCustomActive && customRange ? fmtRange(customRange.start, customRange.end) : 'Свой период'}
        </button>

        {calOpen && (
          <>
            <div onClick={()=>setCalOpen(false)} style={{position:'fixed',inset:0,zIndex:99}}/>
            <div style={{
              position:'absolute', top:44, left:0, width:320, zIndex:100,
              background:t.surface, ...ch(10),
              boxShadow:'0 16px 48px rgba(0,0,0,0.5)',
              padding:16, animation:'fadeIn .15s var(--ease)',
            }}>
              <div style={{ fontSize:11, color:t.textMuted, marginBottom:12, letterSpacing:'0.05em' }}>
                {!pendingStart ? 'Выберите начало периода' : !pendingEnd ? 'Выберите конец периода' : 'Готово'}
              </div>

              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
                <button onClick={()=>setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1))}
                  style={{ width:28, height:28, background:t.surfaceAlt, color:t.textPrimary, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', ...ch(6) }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span style={{ fontSize:13, fontWeight:600, color:t.textPrimary }}>
                  {months[viewMonth.getMonth()]} {viewMonth.getFullYear()}
                </span>
                <button onClick={()=>setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1))}
                  style={{ width:28, height:28, background:t.surfaceAlt, color:t.textPrimary, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', ...ch(6) }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
                {weekdays.map(d => (
                  <div key={d} style={{ fontSize:10, color:t.textMuted, textAlign:'center', padding:'4px 0', letterSpacing:'0.05em', textTransform:'uppercase' }}>{d}</div>
                ))}
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2 }}>
                {grid.map((d, i) => {
                  if (!d) return <div key={i}/>;
                  const isT = sameDay(d, today);
                  const isStart = sameDay(d, pendingStart);
                  const isEnd = sameDay(d, pendingEnd);
                  const inSel = inRange(d) && !isStart && !isEnd;
                  const isEdge = isStart || isEnd;
                  return (
                    <button key={i}
                      onClick={()=>handleDayClick(d)}
                      onMouseEnter={()=>setHoverDate(d)}
                      onMouseLeave={()=>setHoverDate(null)}
                      style={{
                        height:32, fontSize:12, fontWeight: isEdge ? 600 : isT ? 600 : 400,
                        background: isEdge ? t.accent : inSel ? (t.bg === '#0A0A0A' ? 'rgba(63,110,232,0.2)' : 'rgba(63,110,232,0.12)') : 'transparent',
                        color: isEdge ? '#fff' : isT ? t.accent : t.textPrimary,
                        border:'none', cursor:'pointer', fontFamily:'inherit',
                        ...ch(4),
                      }}>{d.getDate()}</button>
                  );
                })}
              </div>

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:14, paddingTop:12, borderTop:`1px solid ${t.border}` }}>
                <button onClick={reset} style={{ fontSize:12, color:t.textSecondary, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit' }}>Сбросить</button>

              </div>
            </div>
          </>
        )}
      </div>

      {isCustomActive && (
        <button onClick={reset} style={{
          height:36, padding:'0 10px', display:'inline-flex', alignItems:'center', gap:6,
          background:'transparent', color:t.textMuted,

          Сбросить

  );

function ToastDemo({ t }) {
  const [toasts, setToasts] = useState([]);
  const msgs = {
    success:{title:'Сделка закрыта',body:'ООО Ромашка — 4 800 000 ₽'},
    info:   {title:'Новая заявка',  body:'Иван Петров через Telegram'},

  const fire = (type) => {

    <div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
        {['success','info','warning','error'].map(type => (
          <Btn key={type} variant="secondary" size="md" t={t} onClick={()=>fire(type)}>{type}</Btn>

      </div>
      <div style={{ position:'fixed', bottom:24, right:24, zIndex:999, display:'flex', flexDirection:'column', gap:8 }}>
        {toasts.map(toast => (
          <div key={toast.id} className="toast-anim" style={{

            <div style={{ fontSize:11, color:t.textMuted, letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:12 }}>Источники (категориальные цвета)</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <Tag t={t} bg="rgba(63,110,232,0.18)" color={C.brand}>direct</Tag>
              <Tag t={t} bg="rgba(99,102,241,0.18)" color={C.indigo}>yandex</Tag>
              <Tag t={t} bg="rgba(251,146,60,0.18)" color={C.tangerine}>telegram</Tag>
              <Tag t={t} bg="rgba(148,163,184,0.18)" color={C.slate}>другое</Tag>
            </div>
          </div>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 05 · KPI                                           */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="kpi" label="05 · KPI-карточки" title="Метрики и показатели" t={t}>
        <div style={row4}>
          <KpiCard t={t} accent label="Маржа" value="1 540 000 ₽" sub="154% от плана" sparkData={SPARK_MARGIN} progress={100}/>
          <KpiCard t={t} label="Доходы" value="1 550 000 ₽" sparkData={SPARK_INCOME} sparkColor={C.emerald}/>
          <KpiCard t={t} label="Расходы" value="10 000 ₽" sparkData={SPARK_EXPENSE} sparkColor={C.crimson}/>
          <KpiCard t={t} variant="empty"/>
        </div>
        <div style={{...row4, marginTop:16}}>
          <KpiCard t={t} label="Конверсия" value="12,4%" delta="2,1пп" deltaPos sub="к месяцу"/>
          <KpiCard t={t} label="Заявок" value="48" delta="18%" deltaPos sparkData={[8,12,10,18,14,11,16]} sparkColor={C.indigo}/>
          <KpiCard t={t} label="Цикл сделки" value="18,6 дн." delta="12%" deltaPos={false}/>
          <KpiCard t={t} label="Средний чек" value="376 185 ₽" delta="4,2%" deltaPos={false} sub="к плану"/>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 06 · ГРАФИКИ                                       */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="charts" label="06 · Графики" title="Визуализация данных · monotone curves" t={t}>
        <div style={card({ marginBottom:16 })}>
          <div style={{ marginBottom:16, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <Eyebrow t={t}>Маржа · Доходы · Расходы</Eyebrow>
            <span style={{ fontSize:11, color:t.textMuted }}>наведи курсор на дату</span>
          </div>
          <LineChart series={LINE_SERIES} labels={LINE_LABELS} t={t} height={280}/>
        </div>
        <div style={row2}>
          <div style={card()}>
            <div style={{ marginBottom:16 }}><Eyebrow t={t}>Выручка · 6 мес.</Eyebrow></div>
            <Bars data={BAR_DATA} t={t}/>
          </div>
          <div style={card()}>
            <div style={{ marginBottom:16 }}><Eyebrow t={t}>Источники · heat-классификация</Eyebrow></div>
            <HeatBars rows={HEAT_ROWS} t={t}/>
          </div>
        </div>
        <div style={{...row2, marginTop:16}}>
          <div style={card()}>
            <div style={{ marginBottom:16 }}><Eyebrow t={t}>Заявки по статусам</Eyebrow></div>
            <div style={{ display:'flex', alignItems:'center', gap:32 }}>
              <Donut data={STATUS_DONUT} size={170} t={t} center={{value:'91',label:'Заявок'}}/>
              <div style={{ display:'flex', flexDirection:'column', gap:14, flex:1 }}>
                {STATUS_DONUT.map(d => (
                  <div key={d.name} style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <span style={{ width:10, height:10, background:d.color, flexShrink:0 }}/>
                    <span style={{ fontSize:13, color:t.textPrimary, flex:1 }}>{d.name}</span>
                    <span style={{ fontSize:14, fontWeight:700, color:t.textPrimary, fontVariantNumeric:'tabular-nums' }}>{d.value}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={card()}>
            <div style={{ marginBottom:16 }}><Eyebrow t={t}>Источники трафика · категориальные цвета</Eyebrow></div>
            <div style={{ display:'flex', alignItems:'center', gap:32 }}>
              <Donut data={SOURCE_DONUT} size={170} t={t} center={{value:'103',label:'Визитов'}}/>
              <div style={{ display:'flex', flexDirection:'column', gap:14, flex:1 }}>
                {SOURCE_DONUT.map(d => (
                  <div key={d.name} style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <span style={{ width:10, height:10, background:d.color, flexShrink:0 }}/>
                    <span style={{ fontSize:13, color:t.textPrimary, flex:1 }}>{d.name}</span>
                    <span style={{ fontSize:14, fontWeight:700, color:t.textPrimary, fontVariantNumeric:'tabular-nums' }}>{d.value}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 07 · ТАБЛИЦА                                       */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="table" label="07 · Таблица" title="CRM-таблица заявок" t={t}>
        <Table rows={TABLE_ROWS} t={t}/>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 08 · НАВИГАЦИЯ                                     */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="nav" label="08 · Навигация" title="Sidebar и period tabs" t={t}>
        <div style={{ display:'flex', gap:24, alignItems:'flex-start' }}>
          <Sidebar t={t}/>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ background:t.surface, ...ch(10), padding:20 }}>
              <div style={{ marginBottom:12 }}><Eyebrow t={t}>Period Tabs · сегодня / неделя / месяц + календарь</Eyebrow></div>
              <PeriodTabs value={period} customRange={customRange} onChange={handlePeriod} t={t}/>
            </div>
          </div>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 09 · УВЕДОМЛЕНИЯ                                   */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="notif" label="09 · Уведомления" title="Bell, dropdown, toast" t={t}>
        <div style={{ display:'flex', gap:32, alignItems:'flex-start', flexWrap:'wrap' }}>
          <div>
            <div style={{ fontSize:11, color:t.textMuted, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:12 }}>Notification bell (нажми)</div>
            <NotifBell t={t}/>
          </div>
          <div>
            <div style={{ fontSize:11, color:t.textMuted, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:12 }}>Toast (нажми, чтобы показать)</div>
            <ToastDemo t={t}/>
          </div>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 10 · DEAL PANEL                                    */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="panel" label="10 · Панель сделки" title="Детальная боковая панель" t={t}>
        <DealPanel t={t}/>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 11 · EMPTY STATES                                  */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="empty" label="11 · Empty states" title="Заглушки" t={t}>
        <div style={row3}>
          <EmptyState t={t}
            icon="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"
            title="Нет заявок"
            body="Заявки появятся когда клиенты оставят контакт через форму или менеджер добавит вручную"
            cta="Добавить заявку"/>
          <EmptyState t={t}
            icon="M3 3v18h18M18.4 9.6C16 7 12 6 9.5 8.5S6.5 15 9 17.5"
            title="Нет данных за период"
            body="Нет данных за выбранный диапазон. Попробуйте расширить период"/>
          <EmptyState t={t}
            icon="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M12 12h.01M12 16h.01"
            title="Не настроен план"
            body="Задайте цель на месяц чтобы видеть прогресс выполнения в KPI"
            cta="Настроить план"/>
        </div>
      </Section>

      {/* ───────────────────────────────────────────────── */}
      {/* 12 · МОДАЛКА                                       */}
      {/* ───────────────────────────────────────────────── */}
      <Section id="modal" label="12 · Модалка" title="Диалоговое окно" t={t}>
        <ModalDemo t={t}/>
      </Section>

      {/* FOOTER */}
      <div style={{ padding:'40px 48px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <Logo size={20}/>
          <span style={{ fontSize:12, color:t.textMuted }}>AIVISION · Design System Reference</span>
        </div>
        <span style={{ fontSize:12, color:t.textMuted }}>Inter · Chamfer 8px · 7 цветов · monotone curves</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
