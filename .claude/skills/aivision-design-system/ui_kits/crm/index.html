// Steffen monotone smooth path
function smooth(pts) {
  const n=pts.length; if(n<2) return '';
  if(n===2) return `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
  const t=new Array(n);
  for(let i=1;i<n-1;i++){const dx1=pts[i][0]-pts[i-1][0],dx2=pts[i+1][0]-pts[i][0],s1=(pts[i][1]-pts[i-1][1])/dx1,s2=(pts[i+1][1]-pts[i][1])/dx2;if(s1*s2<=0){t[i]=0}else{const p=(s1*dx2+s2*dx1)/(dx1+dx2);t[i]=Math.sign(s1)*Math.min(Math.abs(s1),Math.abs(s2),.5*Math.abs(p));}}
  t[0]=(pts[1][1]-pts[0][1])/(pts[1][0]-pts[0][0]); t[n-1]=(pts[n-1][1]-pts[n-2][1])/(pts[n-1][0]-pts[n-2][0]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<n-1;i++){const dx=(pts[i+1][0]-pts[i][0])/3,cp1x=pts[i][0]+dx,cp1y=pts[i][1]+t[i]*dx,cp2x=pts[i+1][0]-dx,cp2y=pts[i+1][1]-t[i+1]*dx;d+=` C${cp1x},${cp1y} ${cp2x},${cp2y} ${pts[i+1][0]},${pts[i+1][1]}`;}
  return d;
}

function Sparkline({ data, color, height=32 }) {
  const ref = useRef(null);
  const [w, setW] = useState(120);
  useEffect(() => { if(ref.current) { const ro=new ResizeObserver(([e])=>setW(e.contentRect.width)); ro.observe(ref.current); return ()=>ro.disconnect(); } }, []);
  const mn=Math.min(...data), mx=Math.max(...data), rng=(mx-mn)||1;
  const pts=data.map((v,i)=>[(i/(data.length-1))*w, height-((v-mn)/rng)*height*.85-2]);
  const line=smooth(pts);
  const area=line+` L${pts[pts.length-1][0]},${height} L${pts[0][0]},${height} Z`;
  const id=`sg-${color.replace(/[^a-zA-Z0-9]/g,'x')}-${Math.round(w)}`;
  return (
    <div ref={ref} style={{ width:'100%', height }}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ display:'block', overflow:'visible' }}>
        <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".25"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
        <path d={area} fill={`url(#${id})`}/><path d={line} fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

function KpiCard({ label, value, delta, deltaPos, sub, sparkData, sparkColor, accent }) {
  const bg = accent ? C.brand : T.surface;
  const fg = accent ? '#fff' : T.textPrimary;
  const fgSub = accent ? 'rgba(255,255,255,.7)' : T.textMuted;
  const lineColor = sparkColor || (accent ? 'rgba(255,255,255,.9)' : C.brand);
  return (
    <div style={{ background:bg, ...ch(10), padding:'18px 18px 0', minHeight:130, display:'flex', flexDirection:'column', gap:5, overflow:'hidden' }}>
      <div style={{ fontSize:10, fontWeight:500, letterSpacing:'0.14em', textTransform:'uppercase', color:fgSub }}>{label}</div>
      <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:26, fontWeight:700, letterSpacing:'-0.025em', lineHeight:1.1, color:fg, fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{value}</div>
      <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, fontVariantNumeric:'tabular-nums' }}>
        {delta && <span style={{ fontWeight:600, color: accent ? 'rgba(255,255,255,.9)' : (deltaPos ? C.emerald : C.crimson) }}>{deltaPos ? '↑ +' : '↓ −'}{delta}</span>}
        {sub && <span style={{ color:fgSub }}>{sub}</span>}
      </div>
      {accent && <div style={{ height:4, background:'rgba(255,255,255,.2)', position:'relative', marginTop:4 }}><div style={{ position:'absolute', inset:0, width:'76%', background:'#fff' }}/></div>}
      {sparkData && <div style={{ marginTop:'auto', marginLeft:-18, marginRight:-18 }}><Sparkline data={sparkData} color={lineColor} height={32}/></div>}
    </div>
  );
}

function LineChart({ series, labels }) {
  const ref = useRef(null);
  const [w, setW] = useState(600);
  const [hov, setHov] = useState(null);
  useEffect(() => { if(ref.current){const ro=new ResizeObserver(([e])=>setW(e.contentRect.width));ro.observe(ref.current);return()=>ro.disconnect();} },[]);
  const H=220, pL=48, pR=16, pT=20, pB=28, iW=Math.max(w-pL-pR,0), iH=H-pT-pB;
  const allV=series.flatMap(s=>s.data); const mx=Math.max(...allV,0);
  const nice=(() => { if(!mx)return 100; const e=Math.pow(10,Math.floor(Math.log10(mx))); const m=mx/e; return(m<=2?2:m<=5?5:10)*e; })();
  const xStep=labels.length>1?iW/(labels.length-1):0;
  const xy=(i,v)=>[pL+i*xStep, pT+iH-(v/nice)*iH];
  const fmtK=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':String(Math.round(v));
  return (
    <div ref={ref} style={{ position:'relative', width:'100%' }}>
      <svg width="100%" height={H} viewBox={`0 0 ${w} ${H}`} style={{ display:'block', overflow:'visible' }}>
        <defs>{series.map((s,si)=><linearGradient key={si} id={`lc${si}${Math.round(w)}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={s.color} stopOpacity=".25"/><stop offset="100%" stopColor={s.color} stopOpacity="0"/></linearGradient>)}</defs>
        {[0,nice/2,nice].map((tv,i)=>{ const y=pT+iH-(tv/nice)*iH; return <g key={i}><line x1={pL} x2={w-pR} y1={y} y2={y} stroke={T.border} strokeWidth="1" strokeDasharray={i?'2 4':''}/><text x={pL-6} y={y+4} fontSize="9" textAnchor="end" fill={T.textMuted} fontFamily="IBM Plex Sans">{fmtK(tv)}</text></g>; })}
        {labels.map((l,i)=><text key={i} x={pL+i*xStep} y={H-6} fontSize="9" textAnchor="middle" fill={T.textMuted} fontFamily="IBM Plex Sans">{l}</text>)}
        {series.map((s,si)=>{ const pts=s.data.map((v,i)=>xy(i,v)); const line=smooth(pts); const area=line+` L${pts[pts.length-1][0]},${pT+iH} L${pts[0][0]},${pT+iH} Z`; return <g key={si}><path d={area} fill={`url(#lc${si}${Math.round(w)})`}/><path d={line} fill="none" stroke={s.color} strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={hov===i?4.5:3} fill={T.surface} stroke={s.color} strokeWidth="2"/>)}</g>; })}
        {labels.map((_,i)=><rect key={i} x={pL+i*xStep-xStep/2} y={pT} width={xStep||iW} height={iH} fill="transparent" onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>)}
        {hov!==null && <line x1={pL+hov*xStep} x2={pL+hov*xStep} y1={pT} y2={pT+iH} stroke={T.borderStrong||'#3A3A3A'} strokeWidth="1" strokeDasharray="3 3"/>}
      </svg>
      {hov!==null && <div style={{ position:'absolute', left:pL+hov*xStep, top:0, transform:'translateX(-50%)', background:T.surfaceAlt, padding:'8px 12px', ...ch(6), fontSize:11, pointerEvents:'none', boxShadow:'0 4px 16px rgba(0,0,0,.5)', zIndex:5, minWidth:140 }}>
        <div style={{ fontSize:10, color:T.textMuted, marginBottom:4 }}>{labels[hov]}</div>
        {series.map((s,i)=><div key={i} style={{ display:'flex', alignItems:'center', gap:6, fontVariantNumeric:'tabular-nums', marginBottom:2 }}><span style={{ width:8, height:8, background:s.color, borderRadius:'50%' }}/><span style={{ color:T.textSecondary, fontSize:10, flex:1 }}>{s.name}</span><span style={{ fontWeight:600 }}>{new Intl.NumberFormat('ru-RU').format(s.data[hov])} ₽</span></div>)}
      </div>}
      <div style={{ display:'flex', justifyContent:'center', gap:20, marginTop:8 }}>
        {series.map((s,i)=><div key={i} style={{ display:'flex', alignItems:'center', gap:6 }}><span style={{ width:8, height:8, background:s.color, borderRadius:'50%' }}/><span style={{ fontSize:11, color:T.textSecondary }}>{s.name}</span></div>)}
      </div>
    </div>
  );
}

const NAV = [

  const filtered = LEADS.filter(r => r.name.toLowerCase().includes(search.toLowerCase()));
  return (
    <div className="fade" style={{ padding:'28px 32px', overflowY:'auto', height:'100%' }}>
      <Eyebrow>ВОРОНКА · МАЙ 2026</Eyebrow>
      <h1 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:28, fontWeight:500, letterSpacing:'-0.02em', marginTop:8, marginBottom:20 }}>
        <span style={{ color:C.brand }}>48</span> заявок в работе. <span style={{ color:C.emerald }}>+11</span> к апрелю.
      </h1>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
        <div style={{ position:'relative', flex:1, maxWidth:320 }}>
          <svg style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)' }} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по имени..." style={{ width:'100%', height:36, padding:'0 12px 0 32px', background:T.surface, color:T.textPrimary, border:'none', outline:'none', fontSize:12, ...ch(8) }}/>
        </div>
        {['Все','Горячие','Тёплые','Холодные'].map((f,i)=>(
          <button key={f} style={{ height:36, padding:'0 12px', fontSize:11, fontWeight:i===0?600:500, background:i===0?T.accent||C.brand:T.surfaceAlt, color:i===0?'#fff':T.textSecondary, border:'none', cursor:'pointer', ...ch(6) }}>{f}</button>
        ))}
      </div>
      <div style={{ background:T.surface, ...ch(10), overflow:'hidden' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
          <thead><tr style={{ background:T.surfaceAlt }}>{['','Имя','Телефон','Статус','Heat','Источник','Сумма','Дата'].map(h=><th key={h} style={{ padding:'9px 12px', textAlign:'left', fontSize:10, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:T.textSecondary, whiteSpace:'nowrap' }}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map((r,i)=>(
              <tr key={i} style={{ borderTop:`1px solid ${T.border}`, cursor:'pointer', transition:'background .12s' }} onMouseEnter={e=>e.currentTarget.style.background=T.surfaceAlt} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <td style={{ padding:'10px 12px' }}><HeatIcon v={r.heat}/></td>
                <td style={{ padding:'10px 12px', fontWeight:500 }}>{r.name}</td>
                <td style={{ padding:'10px 12px', color:T.textSecondary, fontVariantNumeric:'tabular-nums' }}>{r.phone}</td>
                <td style={{ padding:'10px 12px' }}><StatusTag s={r.status}/></td>
                <td style={{ padding:'10px 12px' }}><span style={{ display:'inline-flex', padding:'2px 6px', fontSize:10, fontWeight:600, background:`rgba(${r.heat==='hot'?'244,63,94':r.heat==='warm'?'252,211,77':'148,163,184'},.15)`, color:r.heat==='hot'?C.crimson:r.heat==='warm'?C.sun:C.slate, ...ch(4) }}>{r.heat==='hot'?'Горячий':r.heat==='warm'?'Тёплый':'Холодный'}</span></td>
                <td style={{ padding:'10px 12px' }}><span style={{ display:'inline-flex', padding:'2px 6px', fontSize:10, fontWeight:600, background:`rgba(${r.src==='direct'?'63,110,232':r.src==='yandex'?'99,102,241':'251,146,60'},.15)`, color:SRC_COLOR[r.src], ...ch(4) }}>{r.src}</span></td>
                <td style={{ padding:'10px 12px', fontFamily:'IBM Plex Mono', fontSize:13, fontWeight:700, fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em' }}>{r.sum}</td>
                <td style={{ padding:'10px 12px', color:T.textMuted, fontVariantNumeric:'tabular-nums' }}>{r.date}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const TASKS = [
  { text:'Позвонить Ивану Петрову', date:'Сегодня', overdue:false, done:false },
  { text:'Подготовить коммерческое предложение — Мария Сидорова', date:'Сегодня', overdue:true, done:false },
  { text:'Отправить договор — Ольга Козлова', date:'Сегодня', overdue:false, done:true },
  { text:'Провести онбординг — новый клиент', date:'Завтра', overdue:false, done:false },
  { text:'Обновить KPI-дашборд клиента', date:'27 мая', overdue:false, done:false },
];

function TasksPage() {
  const [tasks, setTasks] = useState(TASKS);
  const toggle = i => setTasks(prev => prev.map((t,j) => j===i ? {...t, done:!t.done} : t));
  return (
    <div className="fade" style={{ padding:'28px 32px', overflowY:'auto', height:'100%' }}>
      <Eyebrow>ПЛАН НА 24 МАЯ</Eyebrow>
      <h1 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:28, fontWeight:500, letterSpacing:'-0.02em', marginTop:8, marginBottom:20 }}>
        <span style={{ color:C.brand }}>3</span> задачи на сегодня. <span style={{ color:C.crimson }}>1</span> просрочена.
      </h1>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {tasks.map((t,i) => (
          <div key={i} onClick={()=>toggle(i)} style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', background:T.surface, cursor:'pointer', opacity:t.done?.5:1, transition:'all .15s', ...ch(8) }}>
            <div style={{ width:18, height:18, flexShrink:0, background:t.done?C.emerald:T.surfaceAlt, display:'flex', alignItems:'center', justifyContent:'center', ...ch(4) }}>
              {t.done && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>}
            </div>
            <span style={{ flex:1, fontSize:13, fontWeight:500, textDecoration:t.done?'line-through':'none', color:t.done?T.textMuted:T.textPrimary }}>{t.text}</span>
            <span style={{ fontSize:11, padding:'2px 8px', background: t.overdue?'rgba(244,63,94,.15)':t.date==='Сегодня'?'rgba(252,211,77,.18)':'rgba(148,163,184,.15)', color:t.overdue?C.crimson:t.date==='Сегодня'?C.sun:C.slate, ...ch(4) }}>{t.overdue?'Просрочена':t.date}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function PlaceholderPage({ title, eyebrow }) {
  return (
    <div className="fade" style={{ padding:'28px 32px', height:'100%', display:'flex', flexDirection:'column' }}>
      <Eyebrow>{eyebrow}</Eyebrow>
      <h1 style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:28, fontWeight:500, letterSpacing:'-0.02em', marginTop:8, marginBottom:32, color:T.textPrimary }}>{title}</h1>
      <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:12, color:T.textMuted }}>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M9 21V9"/></svg>
        <span style={{ fontSize:13 }}>Раздел в разработке</span>
      </div>
    </div>
  );
}

/* ─── APP ───────────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState('dashboard');
  const [isDark, setIsDark] = useState(true);
  const [themeKey, setThemeKey] = useState(0);

  const toggleTheme = () => {
    const next = !isDark;
    Object.assign(T, next ? DARK_T : LIGHT_T);
    setIsDark(next);
    setThemeKey(k => k + 1);
  };

  return (
    <div key={themeKey} style={{ display:'flex', height:'100vh', background:T.bg, color:T.textPrimary, transition:'background .2s, color .2s' }}>
      {/* Sidebar */}
      <aside style={{ width:200, flexShrink:0, background:T.surface, display:'flex', flexDirection:'column', borderRight:`1px solid ${T.border}` }}>
        <div style={{ padding:'16px 16px 12px', borderBottom:`1px solid ${T.border}` }}><Logo size={20}/></div>
        <nav style={{ padding:'8px 8px', flex:1 }}>
          {NAV.map(n => {
            const active = page === n.id;
            return (
              <button key={n.id} onClick={()=>setPage(n.id)} style={{ width:'100%', display:'flex', alignItems:'center', gap:10, height:36, padding:'0 10px', marginBottom:2, fontSize:12, fontWeight: active?600:500, background: active?T.surfaceAlt:'transparent', color: active?T.textPrimary:T.textSecondary, border:'none', cursor:'pointer', textAlign:'left', transition:'all .12s', ...ch(6) }}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={n.icon}/></svg>
                {n.label}
                {active && <span style={{ marginLeft:'auto', width:4, height:4, background:C.brand, borderRadius:'50%' }}/>}
              </button>
            );
          })}
        </nav>
        <div style={{ padding:'12px 16px', borderTop:`1px solid ${T.border}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ width:28, height:28, background:C.brand, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, ...ch(6) }}>ИП</div>
            <div><div style={{ fontSize:11, fontWeight:600 }}>Иван Петров</div><div style={{ fontSize:10, color:T.textMuted }}>Владелец</div></div>
          </div>
        </div>
      </aside>
      {/* Main */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {/* Topbar */}
        <header style={{ height:48, background:T.surface, borderBottom:`1px solid ${T.border}`, display:'flex', alignItems:'center', padding:'0 20px', gap:12, flexShrink:0 }}>
          <div style={{ flex:1 }}/>
          <button onClick={toggleTheme} title={isDark ? 'Светлая тема' : 'Тёмная тема'} style={{ width:32, height:32, background:'transparent', border:'none', cursor:'pointer', color:T.textMuted, display:'flex', alignItems:'center', justifyContent:'center' }}>
            {isDark
              ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
              : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            }
          </button>
          <button style={{ width:32, height:32, background:'transparent', border:'none', cursor:'pointer', color:T.textMuted, display:'flex', alignItems:'center', justifyContent:'center', position:'relative' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span style={{ position:'absolute', top:5, right:5, width:7, height:7, background:C.crimson, borderRadius:'50%' }}/>
          </button>
          <button style={{ width:32, height:32, background:'transparent', border:'none', cursor:'pointer', color:T.textMuted, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          </button>
        </header>
        {/* Content */}
        <main style={{ flex:1, overflow:'hidden' }}>
          {page==='dashboard' && <DashboardPage key="dashboard"/>}
          {page==='leads'     && <LeadsPage key="leads"/>}
          {page==='tasks'     && <TasksPage key="tasks"/>}
          {page==='deals'     && <PlaceholderPage key="deals" eyebrow="ВОРОНКА · МАЙ" title="15 сделок в работе. 4,8 М ₽ в пайплайне."/>}
          {page==='clients'   && <PlaceholderPage key="clients" eyebrow="КЛИЕНТЫ · АКТИВНЫЕ" title="12 whales. LTV выше 1 М ₽."/>}
          {page==='finance'   && <PlaceholderPage key="finance" eyebrow="ФИНАНСЫ · МАЙ 2026" title="Маржа 1 540 000 ₽. +18% к апрелю."/>}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
