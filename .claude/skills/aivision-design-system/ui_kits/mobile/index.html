/* ── Smooth monotone path ───────────────────────────────────── */
function smooth(pts) {
  const n = pts.length; if (n < 2) return '';
  const t = new Array(n);
  for (let i = 1; i < n - 1; i++) {
    const dx1 = pts[i][0]-pts[i-1][0], dx2 = pts[i+1][0]-pts[i][0];
    const s1 = (pts[i][1]-pts[i-1][1])/dx1, s2 = (pts[i+1][1]-pts[i][1])/dx2;
    if (s1*s2 <= 0) t[i]=0;
    else { const p=(s1*dx2+s2*dx1)/(dx1+dx2); t[i]=Math.sign(s1)*Math.min(Math.abs(s1),Math.abs(s2),.5*Math.abs(p)); }
  }
  t[0]=(pts[1][1]-pts[0][1])/(pts[1][0]-pts[0][0]);
  t[n-1]=(pts[n-1][1]-pts[n-2][1])/(pts[n-1][0]-pts[n-2][0]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n-1; i++) {
    const dx=(pts[i+1][0]-pts[i][0])/3;
    d+=` C${pts[i][0]+dx},${pts[i][1]+t[i]*dx} ${pts[i+1][0]-dx},${pts[i+1][1]-t[i+1]*dx} ${pts[i+1][0]},${pts[i+1][1]}`;
  }
  return d;
}

/* ── Mini sparkline (fixed 200×40 viewBox) ──────────────────── */
function Sparkline({ data, color, vw=200, vh=36 }) {
  const mn=Math.min(...data), mx=Math.max(...data), rng=(mx-mn)||1;
  const pts = data.map((v,i) => [(i/(data.length-1))*vw, vh-((v-mn)/rng)*vh*.8-4]);
  const line = smooth(pts);
  const area = line + ` L${pts[pts.length-1][0]},${vh} L0,${vh} Z`;
  const id = `sp${color.replace('#','')}`;
  return (
    <svg width="100%" viewBox={`0 0 ${vw} ${vh}`} preserveAspectRatio="none" style={{ display:'block', overflow:'visible' }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${id})`}/>
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"/>
    </svg>
  );
}

}

/* ── Heat icon ──────────────────────────────────────────────── */

      {v==='cold' && <path d="M4 4L28 4L28 22L22 28L4 28Z" stroke="currentColor" strokeWidth="3"/>}
    </svg>
  );
}

    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      {/* Back nav */}
      <div style={{ padding:'60px 16px 0', flexShrink:0 }}>
        <button onClick={onBack} style={{ display:'inline-flex', alignItems:'center', gap:6, fontSize:12, color:C.brand, background:'none', border:'none', cursor:'pointer', fontFamily:'IBM Plex Sans', marginBottom:14 }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
          Заявки
        </button>
        {/* Lead hero */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:16 }}>
          <div style={{ width:44, height:44, background:C.brand, display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, fontWeight:700, ...ch(8), flexShrink:0 }}>
            {l.name.split(' ').map(w=>w[0]).join('').slice(0,2)}
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:17, fontWeight:600, lineHeight:1.2 }}>{l.name}</div>
            <div style={{ fontSize:12, color:T.textSecondary, marginTop:3 }}>{l.phone}</div>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:6 }}>
              <StatusTag s={l.status}/>
              <span style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:10, fontWeight:600, color:heatColor }}>
                <Heat v={l.heat} s={11}/>{heatLabel}
              </span>
            </div>
          </div>
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:'auto', padding:'0 16px', paddingBottom:90 }}>
        {/* Actions */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8, marginBottom:16 }}>
          {actions.map((a,i) => (
            <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
              <div style={{ width:48, height:48, background:T.surface, display:'flex', alignItems:'center', justifyContent:'center', ...ch(10) }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={a.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={a.icon}/></svg>
              </div>
              <span style={{ fontSize:10, color:T.textSecondary }}>{a.label}</span>
            </div>
          ))}
        </div>

        {/* Info block */}
        <div style={{ ...ch(10), background:T.surface, marginBottom:10, overflow:'hidden' }}>
          {[
            { label:'Источник', val:l.src },
            { label:'Сумма',   val:l.sum, mono:true },
            { label:'Дата',    val:l.date },
          ].map((row,i,arr) => (
            <div key={i} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'11px 14px', borderBottom: i<arr.length-1?`1px solid ${T.border}`:'none' }}>
              <span style={{ fontSize:12, color:T.textMuted }}>{row.label}</span>
              <span style={{ fontSize:13, fontWeight:row.mono?700:500, fontFamily:row.mono?'Onest':'IBM Plex Sans', fontVariantNumeric:'tabular-nums', letterSpacing: row.mono?'-0.02em':0 }}>{row.val}</span>
            </div>
          ))}
        </div>

        {/* Timeline */}
        <Eyebrow style={{ marginBottom:8 }}>История</Eyebrow>
        <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:0 }}>
          {timeline.map((e,i) => (
            <div key={i} style={{ display:'flex', gap:12, paddingBottom:14, position:'relative' }}>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0 }}>
                <div style={{ width:8, height:8, borderRadius:'50%', background:e.color, marginTop:3 }}/>
                {i < timeline.length-1 && <div style={{ width:1, flex:1, background:T.border, marginTop:4 }}/>}
              </div>
              <div style={{ flex:1, paddingBottom: i < timeline.length-1 ? 0 : 0 }}>
                <div style={{ fontSize:12, color:T.textMuted, marginBottom:2, fontVariantNumeric:'tabular-nums' }}>{e.date}</div>
                <div style={{ fontSize:13, color:T.textSecondary, lineHeight:1.5 }}>{e.text}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Comment field */}
        <div style={{ marginTop:4 }}>
          <div style={{ padding:'1.5px', background:T.border, ...ch(8) }}>
            <div style={{ background:T.surfaceAlt, padding:'10px 12px', ...ch(6) }}>
              <div style={{ fontSize:12, color:T.textMuted }}>Добавить комментарий...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   Single phone — nav + tab bar wired
   ───────────────────────────────────────────────────────────── */
function CRMPhone({ initialTab='dashboard' }) {
  const [tab, setTab] = useState(initialTab);
  const [selected, setSelected] = useState(null);

  // When user selects a lead, show detail
  const handleSelect = (lead) => { setSelected(lead); };
  const handleBack = () => setSelected(null);

  return (
    <IOSDevice width={375} height={812} dark={true}>
      <div style={{ height:'100%', position:'relative', background:T.bg, color:'#fff', fontFamily:'IBM Plex Sans,system-ui,sans-serif', WebkitFontSmoothing:'antialiased' }}>
        {selected ? (
          <LeadDetailScreen lead={selected} onBack={handleBack}/>
        ) : (
          <>
            {tab === 'dashboard' && <DashboardScreen/>}
            {tab === 'leads'     && <LeadsScreen onSelect={handleSelect}/>}
            {tab === 'tasks'     && (
              <div style={{ padding:'72px 16px 90px', height:'100%', overflowY:'auto' }}>
                <Eyebrow>ПЛАН НА 24 МАЯ</Eyebrow>
                <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:24, fontWeight:500, letterSpacing:'-0.02em', lineHeight:1.2, marginTop:6, marginBottom:20 }}>
                  <span style={{ color:C.brand }}>3</span> задачи. <span style={{ color:C.crimson }}>1</span> просрочена.
                </div>
                {[
                  { text:'Позвонить Ивану Петрову', due:'Сегодня', over:false, done:false },
                  { text:'КП — Мария Сидорова', due:'Просрочена', over:true, done:false },
                  { text:'Договор — Ольга Козлова', due:'Сегодня', over:false, done:true },
                ].map((t,i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'13px 12px', background:T.surface, marginBottom:6, opacity:t.done?.5:1, ...ch(8) }}>
                    <div style={{ width:18,height:18,background:t.done?C.emerald:T.surfaceAlt,display:'flex',alignItems:'center',justifyContent:'center',...ch(4),flexShrink:0 }}>
                      {t.done && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>}
                    </div>
                    <span style={{ flex:1, fontSize:13, fontWeight:500, textDecoration:t.done?'line-through':'none', color:t.done?T.textMuted:T.textPrimary }}>{t.text}</span>
                    <span style={{ fontSize:10, padding:'2px 7px', background:t.over?'rgba(244,63,94,.15)':'rgba(252,211,77,.15)', color:t.over?C.crimson:C.sun, ...ch(4) }}>{t.due}</span>
                  </div>
                ))}
              </div>
            )}
            {tab === 'finance' && (
              <div style={{ padding:'72px 16px 90px', height:'100%', display:'flex', flexDirection:'column' }}>
                <Eyebrow>ФИНАНСЫ · МАЙ 2026</Eyebrow>
                <div style={{ fontFamily:'Onest, system-ui, sans-serif', fontSize:24, fontWeight:500, letterSpacing:'-0.02em', marginTop:6, marginBottom:20 }}>
                  <span style={{ color:C.brand }}>1,54 М ₽</span> маржа
                </div>
                <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', color:T.textMuted, fontSize:13 }}>Раздел в разработке</div>
              </div>
            )}
          </>
        )}
        {/* Tab bar always visible */}
        {!selected && <TabBar active={tab} onChange={setTab}/>}
        {selected && (
          <div style={{ position:'absolute', bottom:0, left:0, right:0, height:34, pointerEvents:'none' }}/>
        )}
      </div>
    </IOSDevice>
  );
}

/* ─────────────────────────────────────────────────────────────
   Three phones side by side
   ───────────────────────────────────────────────────────────── */
function App() {
  return (
    <div style={{ minHeight:'100vh', background:'#080808', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'40px 24px' }}>
      <div style={{ marginBottom:36, textAlign:'center' }}>
        <div style={{ display:'inline-flex', alignItems:'center', gap:10, marginBottom:8 }}>
          <svg width="20" height="20" viewBox="0 0 256 256"><path d="M 0 0 L 256 0 L 256 208 L 208 256 L 0 256 Z" fill="#3F6EE8"/></svg>
          <span style={{ fontFamily:'Onest, system-ui, sans-serif', fontWeight:700, fontSize:13, letterSpacing:'0.14em', textTransform:'uppercase', color:'#fff' }}>AIVISION CRM</span>
        </div>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'#444' }}>Mobile UI Kit · iOS</div>
      </div>
      <div style={{ display:'flex', gap:32, alignItems:'flex-start', flexWrap:'wrap', justifyContent:'center' }}>
        <div>
          <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'#444', textAlign:'center', marginBottom:12 }}>Дашборд</div>
          <CRMPhone initialTab="dashboard"/>
        </div>
        <div>
          <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'#444', textAlign:'center', marginBottom:12 }}>Заявки</div>
          <CRMPhone initialTab="leads"/>
        </div>
        <div>
          <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'#444', textAlign:'center', marginBottom:12 }}>Задачи</div>
          <CRMPhone initialTab="tasks"/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
