<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AIVISION CRM · Reference Work</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-family:'Inter',sans-serif;font-feature-settings:'cv02','cv03','cv04','cv11'}
  @supports(font-variation-settings:normal){html{font-family:'Inter var',sans-serif}}
  body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.3)}
  :root{--ease:cubic-bezier(.4,0,.2,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .page-anim{animation:fadeIn .25s var(--ease) both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ═══════════════════════════════════════════════════════════════════
// ОСНОВЫ — токены, темы, chamfer, логотип, heat
// ═══════════════════════════════════════════════════════════════════

const THEMES = {
  dark: {
    bg:'#0A0A0A', surface:'#181818', surfaceAlt:'#222222',
    border:'#2A2A2A', borderStrong:'#3A3A3A',
    textPrimary:'#FFFFFF', textSecondary:'#A3A3A3', textMuted:'#666666',
    accent:'#3F6EE8', accentHover:'#5A85F0',
  },
  light: {
    bg:'#FAFAFA', surface:'#FFFFFF', surfaceAlt:'#F4F4F4',
    border:'#E8E8E8', borderStrong:'#D4D4D4',
    textPrimary:'#0A0A0A', textSecondary:'#666666', textMuted:'#999999',
    accent:'#3F6EE8', accentHover:'#2D5BD4',
  },
};
// ═══════════════════════════════════════════════════════════════════
// ПАЛИТРА AIVISION v1.0 — 7 цветов, закрытая система
// СЕМАНТИКА (5): brand · emerald · crimson · sun · slate
// КАТЕГОРИАЛЬНЫЕ (2): indigo · tangerine
// ═══════════════════════════════════════════════════════════════════

const C = {
  brand:     '#3F6EE8',  // маржа, бренд, primary CTA, "В работе"
  emerald:   '#10B981',  // доход, успех, "Завершена"
  crimson:   '#F43F5E',  // расход, провал, просрочка, ГОРЯЧИЙ ЛИД
  sun:       '#FCD34D',  // в процессе, "Связались", дедлайн, ТЁПЛЫЙ ЛИД
  slate:     '#94A3B8',  // нейтрально, "Недоступен", нет данных, ХОЛОДНЫЙ ЛИД
  indigo:    '#6366F1',  // категориальный — второй синий
  tangerine: '#FB923C',  // категориальный — тёплый акцент
};

// Семантические алиасы
const SEM = { success:C.emerald, danger:C.crimson, warning:C.sun, info:C.brand, neutral:C.slate };

// Heat-классификация лидов — алиасы на семантику
const HEAT = {
  hot:  { color:C.crimson, bg:'rgba(244,63,94,0.15)'  },
  warm: { color:C.sun,     bg:'rgba(252,211,77,0.18)' },
  cold: { color:C.slate,   bg:'rgba(148,163,184,0.18)' },
};

const ch = (px=8) => ({ clipPath:`polygon(0 0,100% 0,100% calc(100% - ${px}px),calc(100% - ${px}px) 100%,0 100%)` });

// ChamferBorder — SVG поверх элемента, обводка не рвётся на скосе
function ChamferBorder({ children, px=8, color='#E8E8E8', strokeWidth=1, style={} }) {
  const ref = useRef(null);
  const [dim, setDim] = React.useState({w:0,h:0});
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const ro = new ResizeObserver(([e]) => setDim({w:e.contentRect.width,h:e.contentRect.height}));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const {w,h} = dim;
  const o = strokeWidth / 2;
  const d = w&&h ? `M${o},${o} L${w-o},${o} L${w-o},${h-px} L${w-px},${h-o} L${o},${h-o} Z` : '';
  return (
    <div ref={ref} style={{position:'relative',...style}}>
      {children}
      {d && (
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'visible'}}
             viewBox={`0 0 ${w} ${h}`}>
          <path d={d} fill="none" stroke={color} strokeWidth={strokeWidth} vectorEffect="non-scaling-stroke"/>
        </svg>
      )}
    </div>
  );
}

function Logo({ size=24 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 256 256">
      <path d="M 0 0 L 256 0 L 256 208 L 208 256 L 0 256 Z" fill="#3F6EE8"/>
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SMOOTH PATH — Steffen monotone interpolation
// Профессиональный стандарт для финансовых графиков (Apple, Stripe).
// Кривая плавная, но НИКОГДА не выходит за фактические значения.
// ═══════════════════════════════════════════════════════════════════

function smoothPath(points) {
  const n = points.length;
  if (n < 2) return '';
  if (n === 2) return `M${points[0][0]},${points[0][1]} L${points[1][0]},${points[1][1]}`;

  const tangents = new Array(n);
  for (let i = 1; i < n - 1; i++) {
    const dx1 = points[i][0] - points[i-1][0];
    const dx2 = points[i+1][0] - points[i][0];
    const dy1 = points[i][1] - points[i-1][1];
    const dy2 = points[i+1][1] - points[i][1];
    const s1 = dy1 / dx1;
    const s2 = dy2 / dx2;
    if (s1 * s2 <= 0) {
      tangents[i] = 0;
    } else {
      const p = (s1 * dx2 + s2 * dx1) / (dx1 + dx2);
      tangents[i] = Math.sign(s1) * Math.min(Math.abs(s1), Math.abs(s2), 0.5 * Math.abs(p));
    }
  }
  tangents[0] = (points[1][1] - points[0][1]) / (points[1][0] - points[0][0]);
  tangents[n-1] = (points[n-1][1] - points[n-2][1]) / (points[n-1][0] - points[n-2][0]);

  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (points[i+1][0] - points[i][0]) / 3;
    const cp1x = points[i][0] + dx;
    const cp1y = points[i][1] + tangents[i] * dx;
    const cp2x = points[i+1][0] - dx;
    const cp2y = points[i+1][1] - tangents[i+1] * dx;
    d += ` C${cp1x},${cp1y} ${cp2x},${cp2y} ${points[i+1][0]},${points[i+1][1]}`;
  }
  return d;
}

function HeatIcon({ variant='hot', size=12 }) {
  const heat = HEAT[variant] || HEAT.hot;
  const path = 'M4 4 L28 4 L28 22 L22 28 L4 28 Z';
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none"
         style={{ flexShrink:0, color:heat.color }}>
      {variant==='hot'  && <path d={path} fill="currentColor"/>}
      {variant==='warm' && (<>
        <path d={path} fill="currentColor" fillOpacity="0.35"/>
        <path d={path} stroke="currentColor" strokeWidth="3"/>
      </>)}
      {variant==='cold' && <path d={path} stroke="currentColor" strokeWidth="3"/>}
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════════
// АТОМЫ
// ═══════════════════════════════════════════════════════════════════

function Eyebrow({ children, color, t }) {
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:12,
      fontSize:11, fontWeight:500, letterSpacing:'0.15em',
      textTransform:'uppercase', color: color || t.accent,
    }}>
      <span style={{ width:24, height:1, background:'currentColor' }}/>
      {children}
    </div>
  );
}

function Btn({ children, variant='primary', size='md', icon, t, onClick, disabled }) {
  const [hover, setHover] = useState(false);
  const sizes = {
    sm: { h:32, px:12, fs:12 },
    md: { h:40, px:16, fs:14 },
    lg: { h:48, px:20, fs:15 },
  };
  const s = sizes[size];
  const styles = {
    primary: {
      bg: hover ? t.accentHover : t.accent,
      color:'#fff', borderColor:'transparent',
    },
    secondary: {
      bg: hover ? t.surfaceAlt : 'transparent',
      color: t.textPrimary, borderColor: t.border,
    },
    ghost: {
      bg: hover ? t.surfaceAlt : 'transparent',
      color: t.textPrimary, borderColor:'transparent',
    },
    danger: {
      bg: hover ? '#c5383d' : SEM.danger,
      color:'#fff', borderColor:'transparent',
    },
  }[variant] || {};
  const useBorder = variant === 'secondary';
  const inner = (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{
        height:s.h, padding:`0 ${s.px}px`, fontSize:s.fs, fontWeight:500,
        background:styles.bg, color:styles.color,
        border:'none', cursor: disabled ? 'not-allowed' : 'pointer',
        opacity: disabled ? 0.5 : 1,
        display:'inline-flex', alignItems:'center', gap:8,
        transition:'background .15s',
        ...ch(8),
        position:'relative', zIndex:1,
      }}>
      {icon}{children}
    </button>
  );
  return useBorder
    ? <ChamferBorder px={8} color={t.border} style={{display:'inline-block'}}>{inner}</ChamferBorder>
    : inner;
}

function Input({ placeholder, value, onChange, state='default', prefix, t, multiline, rows=4, type='text' }) {
  const [focused, setFocused] = useState(false);
  const isError = state==='error';
  const isDisabled = state==='disabled';
  const borderColor = isError ? SEM.danger : (focused||state==='focused') ? t.accent : t.border;
  const strokeWidth = (focused || isError) ? 1.5 : 1;
  const fieldStyle = {
    width:'100%',
    background: t.surface, color: t.textPrimary,
    border:'none', outline:'none',
    fontSize:14, fontFamily:'inherit', fontVariantNumeric:'tabular-nums',
    ...ch(8),
    position:'relative', zIndex:1,
  };
  const Field = multiline ? 'textarea' : 'input';
  return (
    <ChamferBorder px={8} color={borderColor} strokeWidth={strokeWidth} style={{ opacity: isDisabled ? 0.5 : 1 }}>
      <div style={{ position:'relative', display:'flex', alignItems:'center' }}>
        {prefix && <span style={{ position:'absolute', left:12, color:t.textMuted, pointerEvents:'none', zIndex:2 }}>{prefix}</span>}
        <Field
          type={multiline ? undefined : type}
          placeholder={placeholder}
          value={value || ''}
          onChange={onChange}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setFocused(false)}
          disabled={isDisabled}
          rows={multiline ? rows : undefined}
          style={multiline ? {
            ...fieldStyle, padding:'12px', minHeight:rows*20+24, resize:'vertical',
          } : {
            ...fieldStyle, height:40, padding: prefix ? '0 12px 0 36px' : '0 12px',
          }}
        />
      </div>
    </ChamferBorder>
  );
}

function Tag({ children, variant='neutral', t }) {
  const variants = {
    neutral: { bg:t.surfaceAlt, color:t.textSecondary },
    blue:    { bg:'rgba(63,110,232,0.15)', color:C.brand },
    success: { bg:'rgba(16,185,129,0.15)', color:C.emerald },
    warning: { bg:'rgba(252,211,77,0.18)', color:C.sun },
    danger:  { bg:'rgba(244,63,94,0.15)',  color:C.crimson },
  };
  const s = variants[variant] || variants.neutral;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'4px 10px', fontSize:11, fontWeight:600,
      letterSpacing:'0.06em', textTransform:'uppercase',
      background:s.bg, color:s.color,
      ...ch(4),
    }}>{children}</span>
  );
}

function HeatTag({ variant='hot', t }) {
  const heat = HEAT[variant];
  const labels = { hot:'Горячий', warm:'Тёплый', cold:'Холодный' };
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'4px 10px', fontSize:11, fontWeight:600,
      letterSpacing:'0.06em', textTransform:'uppercase',
      background:heat.bg, color:heat.color,
      ...ch(4),
    }}>
      <HeatIcon variant={variant} size={11}/>
      {labels[variant]}
    </span>
  );
}

const STATUS_COLORS = (t) => ({
  'Новая':      { bg:'rgba(63,110,232,0.15)',  color:C.brand },
  'Связались':  { bg:'rgba(252,211,77,0.18)',  color:C.sun },
  'В работе':   { bg:t.accent,                 color:'#fff' },
  'Недоступен': { bg:'rgba(148,163,184,0.18)', color:C.slate },
  'Не целевой': { bg:'rgba(148,163,184,0.18)', color:C.slate },
  'Завершена':  { bg:'rgba(16,185,129,0.15)',  color:C.emerald },
  'Провалена':  { bg:'rgba(244,63,94,0.15)',   color:C.crimson },
});

function StatusTag({ status, t }) {
  const map = STATUS_COLORS(t);
  const s = map[status] || map['Не целевой'];
  return (
    <span style={{
      display:'inline-flex', alignItems:'center',
      padding:'4px 10px', fontSize:11, fontWeight:600,
      letterSpacing:'0.04em',
      background:s.bg, color:s.color,
      ...ch(4),
    }}>{status}</span>
  );
}

function Toggle({ on, onChange, t }) {
  return (
    <div onClick={() => onChange(!on)} style={{
      width:40, height:22, background: on ? t.accent : t.borderStrong,
      position:'relative', cursor:'pointer', transition:'background .2s',
      borderRadius:11,
    }}>
      <div style={{
        position:'absolute', top:2, left: on ? 20 : 2,
        width:18, height:18, background:'#fff', borderRadius:9,
        transition:'left .2s var(--ease)',
      }}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// БОЛЕЕ СЛОЖНЫЕ КОМПОНЕНТЫ
// ═══════════════════════════════════════════════════════════════════

function KpiCard({ label, value, delta, deltaPos, sub, t, accent=false }) {
  return (
    <ChamferBorder px={10} color={accent ? t.accent : t.border}>
      <div style={{ background:t.surface, padding:20, ...ch(10) }}>
        <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:t.textMuted, marginBottom:8 }}>
          {label}
        </div>
        <div style={{ fontSize:28, fontWeight:700, color:t.textPrimary, fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em' }}>
          {value}
        </div>
        {(delta || sub) && (
          <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:8, fontSize:12 }}>
            {delta && (
              <span style={{ color: deltaPos ? SEM.success : SEM.danger, fontVariantNumeric:'tabular-nums', fontWeight:500 }}>
                {delta}
              </span>
            )}
            {sub && <span style={{ color:t.textMuted }}>{sub}</span>}
          </div>
        )}
      </div>
    </ChamferBorder>
  );
}

function SparkLine({ values, color, height=40, width=120 }) {
  const max = Math.max(...values), min = Math.min(...values);
  const range = max - min || 1;
  const step = width / (values.length - 1);
  const coords = values.map((v,i) => [i*step, height - ((v-min)/range)*height]);
  const linePath = smoothPath(coords);
  const areaPath = linePath + ` L${coords[coords.length-1][0]},${height} L${coords[0][0]},${height} Z`;
  const gradId = `spark-${color.replace('#','')}-${width}-${height}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow:'visible' }}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stopColor={color} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill={`url(#${gradId})`}/>
      <path d={linePath} fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Donut({ data, size=160, t }) {
  const total = data.reduce((s,d) => s+d.value, 0);
  const R = 58, r = 36;
  let angle = -Math.PI/2;
  const cx = size/2, cy = size/2;
  return (
    <div style={{ position:'relative', width:size, height:size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {data.map((d,i) => {
          const slice = (d.value/total) * Math.PI * 2;
          const x1 = cx + R*Math.cos(angle), y1 = cy + R*Math.sin(angle);
          const x2 = cx + R*Math.cos(angle+slice), y2 = cy + R*Math.sin(angle+slice);
          const xi1 = cx + r*Math.cos(angle+slice), yi1 = cy + r*Math.sin(angle+slice);
          const xi2 = cx + r*Math.cos(angle), yi2 = cy + r*Math.sin(angle);
          const large = slice > Math.PI ? 1 : 0;
          const path = `M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${xi1},${yi1} A${r},${r} 0 ${large} 0 ${xi2},${yi2} Z`;
          angle += slice;
          return <path key={i} d={path} fill={d.color} stroke={t.surface} strokeWidth="1"/>;
        })}
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <div style={{ fontSize:22, fontWeight:700, color:t.textPrimary, fontVariantNumeric:'tabular-nums' }}>{total}</div>
        <div style={{ fontSize:10, color:t.textMuted, letterSpacing:'0.1em', textTransform:'uppercase' }}>Всего</div>
      </div>
    </div>
  );
}

function Bars({ data, t }) {
  const max = Math.max(...data.map(d => d.v));
  const fmt = (v) => v >= 1e6 ? `${(v/1e6).toFixed(1).replace('.',',')}M` : `${(v/1e3).toFixed(0)}K`;
  const topRightCh = (px=6) => ({ clipPath:`polygon(0 0,calc(100% - ${px}px) 0,100% ${px}px,100% 100%,0 100%)` });
  return (
    <div style={{ display:'grid', gridTemplateColumns:`repeat(${data.length},1fr)`, gap:8, height:120 }}>
      {data.map((d,i) => {
        const pct = Math.max((d.v / max) * 100, 4);
        return (
          <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6, height:'100%', justifyContent:'flex-end' }}>
            <div style={{ fontSize:10, color:t.textMuted, fontVariantNumeric:'tabular-nums' }}>{fmt(d.v)}</div>
            <div style={{
              width:'100%', height:`${pct}%`, flexShrink:0,
              background:t.accent, ...topRightCh(6),
              transition:'height .35s var(--ease)',
            }}/>
            <div style={{ fontSize:10, color:t.textMuted }}>{d.k}</div>
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SIDEBAR + TOPBAR + LAYOUT
// ═══════════════════════════════════════════════════════════════════

function Sidebar({ active, onChange, t }) {
  const items = [
    { id:'dashboard', label:'Дашборд' },
    { id:'leads',     label:'Заявки', badge:3 },
    { id:'clients',   label:'Клиенты' },
    { id:'deals',     label:'Сделки', badge:7 },
    { id:'tasks',     label:'Задачи', badge:2 },
  ];
  return (
    <div style={{ width:220, height:'100%', background:t.surface, borderRight:`1px solid ${t.border}`, padding:'24px 12px', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'0 12px 24px', display:'flex', alignItems:'center', gap:10, color:t.textPrimary }}>
        <Logo size={22}/>
        <div>
          <div style={{ fontSize:13, fontWeight:700, letterSpacing:'0.05em' }}>AIVISION</div>
          <div style={{ fontSize:9, color:t.textMuted, letterSpacing:'0.15em', textTransform:'uppercase' }}>CRM v1.0</div>
        </div>
      </div>
      {items.map(it => {
        const isActive = active === it.id;
        return (
          <button key={it.id} onClick={()=>onChange(it.id)} style={{
            background: isActive ? t.surfaceAlt : 'transparent',
            color: isActive ? t.textPrimary : t.textSecondary,
            border:'none', textAlign:'left', cursor:'pointer',
            padding:'10px 12px', marginBottom:2,
            fontSize:13, fontFamily:'inherit',
            display:'flex', alignItems:'center', justifyContent:'space-between',
            transition:'background .15s, color .15s',
            ...ch(6),
          }}>
            <span>{it.label}</span>
            {it.badge && (
              <span style={{
                fontSize:10, fontWeight:700,
                padding:'2px 6px', minWidth:18, textAlign:'center',
                background: isActive ? t.accent : t.borderStrong,
                color:'#fff', ...ch(3),
              }}>{it.badge}</span>
            )}
          </button>
        );
      })}
      <div style={{ marginTop:'auto', padding:'12px', borderTop:`1px solid ${t.border}`, fontSize:11, color:t.textMuted }}>
        Степан Циклон<br/>
        <span style={{ fontSize:10 }}>CEO · AIVISION</span>
      </div>
    </div>
  );
}

function Topbar({ section, theme, setTheme, t }) {
  const titles = {
    dashboard:'Дашборд', leads:'Заявки', clients:'Клиенты',
    deals:'Сделки', tasks:'Задачи',
  };
  return (
    <div style={{
      height:56, padding:'0 32px', display:'flex', alignItems:'center', justifyContent:'space-between',
      borderBottom:`1px solid ${t.border}`, background:t.surface,
    }}>
      <div style={{ fontSize:18, fontWeight:600, color:t.textPrimary }}>{titles[section]}</div>
      <div style={{ display:'flex', alignItems:'center', gap:16 }}>

}

  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
