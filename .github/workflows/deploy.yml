name: Deploy Landing

on:
  push:
    branches: [dev, main, feat/astro-migration]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set env and deploy path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
            echo "SSH_HOST=217.149.25.80" >> $GITHUB_ENV
            echo "PUBLIC_ENV=production" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_INGEST_KEY=${{ secrets.PUBLIC_INGEST_KEY_PROD }}" >> $GITHUB_ENV
            echo "PUBLIC_YANDEX_VERIFICATION=${{ secrets.YANDEX_VERIFICATION }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_ENV
            echo "SSH_HOST=aivisiontest.ru" >> $GITHUB_ENV
            echo "PUBLIC_ENV=development" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://aivisiontest.ru" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.aivisiontest.ru" >> $GITHUB_ENV
            # PUBLIC keyed-ingest token by design: ships in the client bundle,
            # rate-limited server-side, so a plain env var in the dev build is fine.
            echo "PUBLIC_INGEST_KEY=av_dev_100b8251f21fc6f0a9ff2012addb34429f213b72" >> $GITHUB_ENV
          fi

      - name: Resolve active production web root
        if: github.ref_name == 'main'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          live_hash="$(curl -fsS -H 'Cache-Control: no-cache' \
            "https://shvec.tech/?deploy_probe=${GITHUB_SHA}" | sha256sum | awk '{print $1}')"
          [[ "$live_hash" =~ ^[0-9a-f]{64}$ ]]

          matches="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n find /var/www /opt -xdev -type f -name index.html -exec sha256sum {} + 2>/dev/null" \
            | awk -v expected="$live_hash" '$1 == expected { print $2 }')"
          match_count="$(printf '%s\n' "$matches" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$match_count" != "1" ]; then
            echo "::error::Expected one server index.html matching live shvec.tech; found $match_count"
            exit 1
          fi

          case "$matches" in
            /*/dist/index.html) ;;
            *) echo "::error::Unsafe live shvec.tech index path"; exit 1 ;;
          esac
          echo "DEPLOY_PATH=${matches%/dist/index.html}" >> $GITHUB_ENV

      - name: Validate deploy configuration
        shell: bash
        run: |
          for name in DEPLOY_PATH SSH_HOST PUBLIC_SITE_URL PUBLIC_API_URL PUBLIC_INGEST_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required; refusing to build or deploy"
              exit 1
            fi
          done

          if [ "${{ github.ref_name }}" = "main" ]; then
            if [ "$PUBLIC_SITE_URL" != "https://shvec.tech" ] || [ "$PUBLIC_API_URL" != "https://admin.shvec.tech" ]; then
              echo "::error::Production URLs are invalid; refusing to deploy"
              exit 1
            fi
            if [ "$PUBLIC_INGEST_KEY" = "av_dev_100b8251f21fc6f0a9ff2012addb34429f213b72" ]; then
              echo "::error::Development ingest key cannot be used in production"
              exit 1
            fi
          fi

      - name: Verify production ingest authentication
        if: github.ref_name == 'main'
        shell: bash
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$PUBLIC_API_URL/api/v1/ingest/track" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://shvec.tech' \
            -H "X-Ingest-Key: $PUBLIC_INGEST_KEY" \
            --data '{}')"
          if [ "$status" != "200" ]; then
            echo "::error::Production ingest authentication check failed with HTTP $status"
            exit 1
          fi

      - name: Build (Astro)
        run: npm run build

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ \
            ${{ secrets.SSH_USER }}@"$SSH_HOST":$DEPLOY_PATH/dist/
