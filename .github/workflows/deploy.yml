name: Deploy Landing

on:
  push:
    branches: [dev, main, feat/astro-migration]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set env and deploy path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
            echo "SSH_HOST=217.149.25.80" >> $GITHUB_ENV
            echo "PUBLIC_ENV=production" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.shvec.tech" >> $GITHUB_ENV
            echo "PUBLIC_INGEST_KEY=${{ secrets.PUBLIC_INGEST_KEY_PROD }}" >> $GITHUB_ENV
            echo "PUBLIC_YANDEX_VERIFICATION=${{ secrets.YANDEX_VERIFICATION }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_ENV
            echo "PUBLIC_ENV=development" >> $GITHUB_ENV
            echo "PUBLIC_SITE_URL=https://aivisiontest.ru" >> $GITHUB_ENV
            echo "PUBLIC_API_URL=https://admin.aivisiontest.ru" >> $GITHUB_ENV
            # PUBLIC keyed-ingest token by design: ships in the client bundle,
            # rate-limited server-side, so a plain env var in the dev build is fine.
            echo "PUBLIC_INGEST_KEY=av_dev_100b8251f21fc6f0a9ff2012addb34429f213b72" >> $GITHUB_ENV
          fi

      - name: Validate deploy configuration
        shell: bash
        run: |
          for name in DEPLOY_PATH SSH_HOST PUBLIC_SITE_URL PUBLIC_API_URL PUBLIC_INGEST_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required; refusing to build or deploy"
              exit 1
            fi
          done

          if [ "${{ github.ref_name }}" = "main" ]; then
            if [ "$PUBLIC_SITE_URL" != "https://shvec.tech" ] || [ "$PUBLIC_API_URL" != "https://admin.shvec.tech" ]; then
              echo "::error::Production URLs are invalid; refusing to deploy"
              exit 1
            fi
            if [ "$PUBLIC_INGEST_KEY" = "av_dev_100b8251f21fc6f0a9ff2012addb34429f213b72" ]; then
              echo "::error::Development ingest key cannot be used in production"
              exit 1
            fi
          fi

      # One-time recovery step. Remove after the first successful production run:
      # only the SHA-256 hash is stored in PostgreSQL; the raw key stays in
      # GitHub Secrets and the public client bundle by design.
      - name: Register production ingest key
        if: github.ref_name == 'main'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          key_hash="$(printf '%s' "$PUBLIC_INGEST_KEY" | sha256sum | awk '{print $1}')"
          key_id="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$key_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$key_id" =~ ^[0-9a-f-]{36}$ ]]

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          registered="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n -u postgres psql -X -v ON_ERROR_STOP=1 -d shvec_admin_prod -tAc \"WITH source AS (SELECT tenant_id FROM ingest_keys WHERE key_hash = '2bc1d4215e7c0e2450412ca1dd4115a5720ad9dee557ee68a1d726a2de0e1996'), inserted AS (INSERT INTO ingest_keys (id, tenant_id, key_hash, label) SELECT '$key_id'::uuid, tenant_id, '$key_hash', 'landing-prod-ci-2026-08-10' FROM source ON CONFLICT (key_hash) DO NOTHING RETURNING 1) SELECT count(*) FROM ingest_keys WHERE key_hash = '$key_hash' AND revoked_at IS NULL;\"" \
            | tr -d '[:space:]')"
          if [ "$registered" != "1" ]; then
            echo "::error::Production ingest key was not registered; refusing to deploy"
            exit 1
          fi

      - name: Build (Astro)
        run: npm run build

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/dist/
